<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5ec8ff">
<script id="move">
/* Déménagement (nov. 2026) : l'ancienne adresse GitHub (avec le nom) envoie vers la nouvelle
   en emportant la progression (clés cubiverse-* et blocsmahe-*, compressées dans le #transfert=). */
(function(){
  var NEW='https://blocs-mahe.vercel.app/', OLD='yoniyaiche-droid.github.io';
  var keep=function(k){ return /^(cubiverse|blocsmahe)/.test(k); };
  var b64=function(u8){ var s='',i; for(i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
  var unb64=function(t){ t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; var s=atob(t), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
  var pipe=function(u8,st){ return new Response(new Blob([u8]).stream().pipeThrough(st)).arrayBuffer().then(function(b){ return new Uint8Array(b); }); };
  try{
    var move=function(){
      window.__moving=true; document.documentElement.className+=' moving';
      var o={}, n=0; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(keep(k)){ o[k]=localStorage.getItem(k); n++; } }
      var go=function(h){ location.replace(NEW+(h?'#transfert='+h:'')); };
      if(!n) return go('');
      var raw=new TextEncoder().encode(JSON.stringify(o));
      if(window.CompressionStream&&window.Blob&&Blob.prototype.stream) pipe(raw,new CompressionStream('deflate-raw')).then(function(z){ go('z'+b64(z)); },function(){ go('j'+b64(raw)); });
      else go('j'+b64(raw));
    };
    if(location.hostname===OLD){
      /* on ne part que si la nouvelle adresse répond (son icône se charge) ; sinon on joue ici comme avant */
      var img=new Image(), to=setTimeout(function(){ img.onload=img.onerror=null; },8000);
      img.onerror=function(){ clearTimeout(to); };
      img.onload=function(){ clearTimeout(to); try{ move(); }catch(e){} };
      img.src=NEW+'icon-192.png?v='+Date.now();
      return;
    }
    var m=/[#&]transfert=([zj])([A-Za-z0-9_-]+)/.exec(location.hash);
    if(m){
      window.__moving=true; document.documentElement.className+=' moving';
      var done=function(){ location.replace(location.pathname+location.search); };
      var bytes=unb64(m[2]);
      var p=m[1]==='z'?(window.DecompressionStream?pipe(bytes,new DecompressionStream('deflate-raw')):Promise.reject(0)):Promise.resolve(bytes);
      p.then(function(u){ var o=JSON.parse(new TextDecoder().decode(u));
        for(var k in o){ if(!keep(k)||typeof o[k]!=='string') continue; var cur=localStorage.getItem(k); if(cur===null||o[k].length>cur.length) localStorage.setItem(k,o[k]); }
      }).catch(function(){}).then(done);
    }
  }catch(e){}
})();
</script>
<title>Blocs Mahé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Monde unique et lumineux pour enfants : ciel 3D en fond, feuille de menus arrondie par-dessus. */
:root{--ink:#1d1846;--muted:#6d6896;--line:#ece9f7;--bg:#f7f5ff;--pink:#ff4f8b;--gold:#ffbf2e;--top:38vh;--sw:520px;color-scheme:light}
button:focus-visible,.name-in:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pill.bump,.shake,.box{animation:none!important}.card{transition:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3ff;font-family:'Baloo 2',ui-rounded,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.layer{position:fixed;inset:0;pointer-events:none;display:none}
.layer.on{display:block}
.ia{pointer-events:auto}

/* ---------- Home ---------- */
.topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:12px 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(29,24,70,.22);letter-spacing:.2px}
.logo svg{width:34px;height:34px;filter:drop-shadow(0 3px 0 rgba(29,24,70,.18))}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 14px 5px 8px;font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(29,24,70,.13);white-space:nowrap}
.pill.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.15)}}
.coin{display:inline-block;width:24px;height:24px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,#fff4b8 0 16%,#ffd34d 17% 58%,#e39b00 60%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 0 rgba(29,24,70,.13);flex:0 0 auto}
.iconbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(29,24,70,.13)}
.iconbtn.on{background:var(--ink)}
.sharecard{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;margin:0 0 12px;border-radius:20px;background:linear-gradient(140deg,#ff4f8b,#a855f7);color:#fff;text-align:left;box-shadow:0 5px 0 rgba(29,24,70,.18);font-family:inherit}
.sharecard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,24,70,.18)}
.sharecard .ic{font-size:30px}.sharecard .tx{flex:1;min-width:0}.sharecard b{display:block;font-size:18px}.sharecard .tx span{display:block;font-size:13px;font-weight:600;opacity:.95}.sharecard .go{font-weight:800;background:#fff;color:#c42a62;border-radius:99px;padding:4px 10px;white-space:nowrap}
.sheet{position:absolute;left:0;right:0;bottom:0;top:var(--top);background:var(--bg);border-radius:28px 28px 0 0;box-shadow:0 -6px 30px rgba(29,24,70,.18);display:flex;flex-direction:column;overflow:hidden}
body.land .sheet{top:0;left:auto;width:var(--sw);border-radius:28px 0 0 28px}
body.land .topbar{right:var(--sw)}
.tabs{display:flex;gap:6px;padding:12px 14px 8px}
.tab{flex:1;height:46px;border-radius:16px;font-weight:800;font-size:16px;color:var(--muted);background:#fff;box-shadow:0 3px 0 var(--line)}
.tab.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0b0820}
.pane{flex:1;overflow-y:auto;padding:4px 14px 28px;touch-action:pan-y;-webkit-overflow-scrolling:touch;display:none}
.pane.on{display:block}
.hi{margin:6px 2px 12px;font-size:21px;font-weight:800;line-height:1.15}
.hi span{color:var(--pink)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:340px){.cards{grid-template-columns:1fr}}
.card{position:relative;border-radius:22px;padding:14px 13px 12px;min-height:178px;color:#fff;text-align:left;display:flex;flex-direction:column;box-shadow:0 5px 0 rgba(29,24,70,.2);overflow:hidden;transition:transform .12s}
.card:active{transform:translateY(3px) scale(.98)}
.card::after{content:'';position:absolute;right:-22px;bottom:-26px;width:92px;height:92px;background:rgba(255,255,255,.17);border-radius:20px;transform:rotate(22deg)}
.card .ic{font-size:38px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.14))}
.card h3{margin:8px 0 3px;font-size:18.5px;line-height:1.08;font-weight:800}
.card p{margin:0;font-size:13.5px;line-height:1.22;font-weight:600;opacity:.96}
.card .best{margin-top:auto;padding-top:8px;font-size:12.5px;font-weight:800;position:relative;z-index:1}
.card .play{position:absolute;right:10px;top:10px;background:#fff;color:var(--ink);font-weight:800;border-radius:999px;padding:1px 11px;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.sec{margin:6px 0 16px}
.sec h4,.shop-h{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:42px;height:42px;border-radius:13px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 0 0 2px #fff,0 3px 0 2px var(--line);outline:3px solid transparent;outline-offset:2px}
.swatch.on{outline-color:var(--ink)}
.opt{width:76px;min-height:86px;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:0 3px 0 var(--line);border:3px solid transparent;padding:4px 3px}
.opt span:last-child{text-align:center;line-height:1.05}
.opt.on{border-color:var(--ink);color:var(--ink)}
.opt .em{font-size:30px;line-height:1}
.opt img{width:42px;height:42px;border-radius:9px}
.name-in{width:100%;height:50px;border-radius:15px;border:3px solid var(--line);padding:0 14px;font:inherit;font-size:19px;font-weight:700;color:var(--ink);background:#fff;outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.name-in:focus{border-color:var(--ink)}
.shop-note{color:var(--muted);font-weight:600;font-size:14.5px;margin:2px 2px 14px;line-height:1.3}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px;margin-bottom:18px}
.item{background:#fff;border-radius:18px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 3px 0 var(--line);border:3px solid transparent}
.item.on{border-color:var(--ink)}
.item .em{font-size:34px;height:44px;display:grid;place-items:center}
.item img{width:44px;height:44px;border-radius:10px}
.item .nm{font-weight:800;font-size:13.5px;text-align:center;line-height:1.08;min-height:29px;display:grid;place-items:center}
.item .pr{font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;background:#fff3cf;border-radius:999px;padding:1px 10px}
.item .pr .coin{width:16px;height:16px}
.item .pr.owned{background:#e5f8ec;color:#147a3c}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#toast{position:fixed;z-index:70;pointer-events:none;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:9px 18px;border-radius:999px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;z-index:3}
#toast.show{animation:toast 2.4s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ---------- HUD ---------- */
.hbtn{position:absolute;top:12px;left:12px}
.hud-top{position:absolute;top:12px;left:64px;right:112px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.hud-top .pill{font-size:16px;padding:5px 12px;gap:5px}
.hud-top .pill.warn{background:#ff4f6d;color:#fff}
.hud-coins{position:absolute;top:12px;right:12px}
.heart{width:20px;height:19px;display:block}
#hHearts{gap:2px;padding:6px 10px}
#joy{position:absolute;left:22px;bottom:26px;width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.24);border:3px solid rgba(255,255,255,.7);display:none;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(29,24,70,.22);transform:translate(-50%,-50%);pointer-events:none}
.rbtn{position:absolute;border-radius:50%;background:rgba(255,255,255,.94);display:none;place-items:center;box-shadow:0 5px 0 rgba(29,24,70,.22);touch-action:none}
.rbtn.down{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,24,70,.22)}
.rbtn svg{width:46%;height:46%}
#bJump{right:22px;bottom:34px;width:90px;height:90px}
#bAct{right:126px;bottom:44px;width:74px;height:74px;font-size:32px}
#bDown{right:35px;bottom:138px;width:64px;height:64px}
body.touch #joy{display:block}
body.touch #bJump{display:grid}
body.touch #hud[data-g="arena"] #bAct{display:grid}
body.touch #hud.flying #bDown{display:grid}
.kbd-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(29,24,70,.55);color:#fff;font-weight:600;font-size:14px;padding:6px 16px;border-radius:999px;white-space:nowrap}
body.touch .kbd-hint{display:none}
#buildBar{position:absolute;top:66px;left:10px;right:10px;display:none;flex-direction:column;gap:8px;align-items:center}
#hud[data-g="build"] #buildBar{display:flex}
.brow{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:#fff;border-radius:16px;padding:4px;gap:4px;box-shadow:0 4px 0 rgba(29,24,70,.13)}
.seg button{height:38px;padding:0 13px;border-radius:12px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.palette{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:5px;background:rgba(255,255,255,.88);border-radius:16px;touch-action:pan-x;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.palette button{flex:0 0 auto;width:36px;height:36px;border-radius:10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);border:3px solid transparent}
.palette button.on{border-color:var(--ink);transform:scale(1.08)}
#compass{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center}
#hud[data-g="island"] #compass{display:flex}
#hud[data-g="eggs"].carrying #compass{display:flex;top:116px}
#hud[data-g="mc"].nav #compass{display:flex;top:158px}
#compass2{position:absolute;top:158px;left:50%;transform:translateX(34px);display:none;flex-direction:column;align-items:center}
#hud[data-g="mc"].nav2 #compass2{display:flex}
#hud[data-g="mc"].nav.nav2 #compass{transform:translateX(calc(-100% - 34px))}
#compass2 .arrow{width:54px;height:54px;border-radius:50%;background:#fff3c4;display:grid;place-items:center;box-shadow:0 4px 0 rgba(29,24,70,.15)}
#compass2 svg{width:30px;height:30px}
#compass2 .dist{margin-top:3px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(29,24,70,.4);font-size:14px}
.bubble{background:#fff6d6;border-radius:16px;padding:10px 14px;color:var(--ink)!important;font-size:16px!important;font-weight:700!important}
#eggBar{position:absolute;top:66px;left:10px;right:10px;display:none;justify-content:center;gap:8px;flex-wrap:wrap}
#hud[data-g="eggs"] #eggBar{display:flex}
.ubtn{height:40px;padding:0 13px;border-radius:14px;background:#fff;font-weight:800;font-size:14.5px;box-shadow:0 4px 0 rgba(29,24,70,.13);display:inline-flex;align-items:center;gap:5px}
.ubtn .coin{width:18px;height:18px}
.ubtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(29,24,70,.13)}
body.touch #hud[data-g="eggs"] #bAct{display:grid}
#hud[data-g="brainrot"].carrying #compass{display:flex;top:116px}
#brBar{position:absolute;top:66px;left:10px;right:10px;display:none;justify-content:center}
#hud[data-g="brainrot"] #brBar{display:flex}
#bLock.on{background:#ff4f6d;color:#fff}
body.touch #hud[data-g="brainrot"] #bAct{display:grid}
#royale{display:none}
/* 27-28 : drone, boussole spatiale, défis du jour, album */
#drUI{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;white-space:nowrap;max-width:94%;background:rgba(29,24,70,.78);color:#fff;border-radius:99px;padding:6px 6px 6px 14px;font-weight:800;font-size:15px;margin-top:var(--hd,0px);z-index:5}
#drUI.low .drB{color:#ff6b6b;animation:tuRing .8s infinite}
#drUI .drB,#drUI .drD{font-size:14px}#drUI .drX{font:inherit;font-weight:800;background:#ffd23f;color:#1d1846;border:0;border-radius:99px;padding:7px 12px;white-space:nowrap}
#hud.droneOn #mcBar,#hud.droneOn #mcHot,#hud.droneOn #compass{display:none!important}
#spNav{position:absolute;right:12px;top:118px;display:none;align-items:center;gap:6px;background:rgba(10,14,40,.75);color:#fff;border-radius:99px;padding:5px 12px 5px 6px;font-weight:800;font-size:14px;margin-top:var(--hd,0px);pointer-events:none}
#spNav .spA{display:inline-block;font-size:20px;color:#7dd8ff;transition:transform .15s}
.daily{background:#fff;border-radius:20px;padding:10px 14px 12px;margin:0 0 12px;box-shadow:0 5px 0 rgba(29,24,70,.12)}
.daily .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.daily .dh b{font-size:17px}.daily .dh span{font-weight:800;color:#ff7a1a}
.daily .dr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:14px;font-weight:700;margin-top:6px}
.daily .dr i{grid-column:1/3;height:7px;border-radius:9px;background:#eee9ff;overflow:hidden}.daily .dr u{display:block;height:100%;background:linear-gradient(90deg,#7b4ff0,#ff4f8b);text-decoration:none}
.daily .dr em{font-style:normal;color:#7b4ff0;font-weight:800}.daily .dr.ok .dt{color:#1f9d55}.daily .dr.ok u{background:#22c55e}
.morerow{display:flex;gap:10px;margin:4px 0 18px}.morebtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:12px;background:#fff;color:#1d1846;font:inherit;font-weight:800;font-size:16px;box-shadow:0 5px 0 rgba(29,24,70,.12)}
.morebtn span{font-size:22px}.morebtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,24,70,.12)}
#album .al-box{width:min(94vw,560px);max-height:calc(100% - 10px);display:flex;flex-direction:column}
#album .al-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}#album .al-h b{font-size:20px}
#album .al-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;overflow:auto}
#album .al-it{border:0;padding:0;border-radius:14px;overflow:hidden;background:#eee;position:relative;aspect-ratio:3/4}
#album .al-it img{width:100%;height:100%;object-fit:cover;display:block}#album .al-it span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:2px 6px}
#album .al-empty{font-size:16px;line-height:1.4;color:#5a5480;grid-column:1/-1}
#flashShot{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:300}#flashShot.on{animation:shotA .45s ease-out}
@keyframes shotA{0%{opacity:.9}100%{opacity:0}}
@media (orientation:landscape) and (max-height:500px){#drUI{top:12px;margin-top:0}#spNav{top:64px}}
/* 26. tutoriels animés, visée auto, guidage */
#tuto{position:absolute;inset:0;z-index:60;background:rgba(20,16,50,.28);pointer-events:auto}
#tuto .tuHand{position:absolute;font-size:54px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));transition:transform .12s;pointer-events:none;will-change:left,top}
#tuto .tuHand.press{transform:scale(.84) translateY(3px)}
#tuto .tuRing{position:absolute;border:4px solid #ffd23f;box-shadow:0 0 0 4px rgba(255,210,63,.35),0 0 24px rgba(255,210,63,.8);animation:tuRing 1s ease-in-out infinite;pointer-events:none}
@keyframes tuRing{50%{transform:scale(1.08);opacity:.75}}
#tuto .tuRip{position:absolute;width:60px;height:60px;border-radius:50%;border:3px solid #fff;animation:tuRip 1s ease-out infinite;pointer-events:none}
@keyframes tuRip{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.5);opacity:0}}
#tuto .tuCap{position:absolute;left:50%;transform:translateX(-50%);width:min(88%,420px);background:#fff;color:#1d1846;border-radius:22px;padding:14px 18px;font-size:19px;line-height:1.28;text-align:center;box-shadow:0 8px 0 rgba(29,24,70,.25);pointer-events:none}
#tuto .tuCap.top{top:84px}#tuto .tuCap.mid{top:auto;bottom:34%}
#tuto .tuCap.pop{animation:tuPop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes tuPop{0%{transform:translateX(-50%) scale(.7);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
#tuto .tuBar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(29,24,70,.75);border-radius:99px;padding:6px 6px 6px 14px}

function valueNoise(rng,cell){
  const grid=new Map();
  const v=(i,j)=>{ const k=i*1000+j; let r=grid.get(k); if(r===undefined){ r=rng(); grid.set(k,r); } return r; };
  return (x,y)=>{ const gx=x/cell, gy=y/cell, i=Math.floor(gx), j=Math.floor(gy), fx=gx-i, fy=gy-j;
    const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
    return lerp(lerp(v(i,j),v(i+1,j),sx),lerp(v(i,j+1),v(i+1,j+1),sx),sy); };
}

    g.fillStyle='#fff'; g.beginPath(); g.arc(x-r*0.2,y-r*0.38,r*0.28,0,TAU); g.fill(); g.fillStyle=ink; };

    g.beginPath(); g.ellipse(100,80,11,7,0,0,TAU); g.fill(); g.fillStyle=ink; };

    g.lineWidth=3; g.stroke(); g.lineWidth=7; g.fillStyle=ink; };
  const openMouth=()=>{ g.beginPath(); g.moveTo(42,76); g.quadraticCurveTo(64,108,86,76); g.closePath(); g.fill(); };

    case 'happy': blush(); g.beginPath(); g.arc(44,60,11,Math.PI*1.15,Math.PI*1.85); g.stroke();
      g.beginPath(); g.arc(84,60,11,Math.PI*1.15,Math.PI*1.85); g.stroke(); openMouth(); break;
    case 'wink': blush(); eye(44,54,10); g.beginPath(); g.moveTo(74,57); g.quadraticCurveTo(84,47,94,57); g.stroke();
      g.beginPath(); g.arc(64,72,21,0.2*Math.PI,0.8*Math.PI); g.stroke(); break;
    case 'wow': eye(44,52,11); eye(84,52,11); g.beginPath(); g.ellipse(64,90,9,12,0,0,TAU); g.fill(); break;
    case 'cool': g.fillRect(22,42,36,20); g.fillRect(70,42,36,20); g.fillRect(54,46,20,6);
      g.fillStyle='rgba(255,255,255,.55)'; g.fillRect(28,46,10,5); g.fillRect(76,46,10,5); g.fillStyle=ink;
      g.beginPath(); g.moveTo(48,88); g.quadraticCurveTo(70,97,88,81); g.stroke(); break;
    case 'star': blush(); star(44,54,16); star(84,54,16); openMouth(); break;
    case 'robot': g.fillStyle='#27324a'; g.fillRect(16,36,96,34); g.fillStyle='#5ffbf1'; g.fillRect(28,46,26,14); g.fillRect(74,46,26,14);
      g.fillStyle=ink; for(let i=0;i<5;i++) g.fillRect(38+i*11,84,6,15); break;
    default: blush(); eye(44,54,10); eye(84,54,10); g.beginPath(); g.arc(64,72,22,0.18*Math.PI,0.82*Math.PI); g.stroke();

function animAvatar(A,dt,spd,grounded){
  A.t+=dt; const k=damp(16,dt);

  if(moving) A.walk+=dt*spd*1.7;
  const amp=moving?Math.min(1,spd/6.5)*0.85:0, s=Math.sin(A.walk);
  let la=s*amp, ra=-s*amp, ll=-s*amp, rl=s*amp, laz=0;
  if(!grounded){ la=-2.7; ra=-2.7; ll=0.35; rl=-0.25; }
  if(A.sword) ra=grounded?-0.55+(moving?s*0.25:0):-1.2;
  if(A.waveT>0){ A.waveT-=dt; laz=2.6+Math.sin(A.t*16)*0.3; la=0; }
  if(A.aim){ ra=-1.5; la=-1.3; laz=-0.35; }
  if(A.sit){ la=-1.1; ra=-1.1; ll=-1.5; rl=-1.5; laz=0; }
  A.arms[0].rotation.x=lerp(A.arms[0].rotation.x,la,k);
  A.arms[0].rotation.z=lerp(A.arms[0].rotation.z,laz,k);
  if(A.swing>0){ A.swing-=dt; const p=1-Math.max(0,A.swing)/0.28, e=1-Math.pow(1-p,3); A.arms[1].rotation.x=lerp(-2.9,-0.25,e); }
  else A.arms[1].rotation.x=lerp(A.arms[1].rotation.x,ra,k);
  A.legs[0].rotation.x=lerp(A.legs[0].rotation.x,ll,k);
  A.legs[1].rotation.x=lerp(A.legs[1].rotation.x,rl,k);
  A.body.position.y=A.sit?0:moving?Math.abs(Math.cos(A.walk))*0.07:Math.sin(A.t*2.2)*0.012;
  if(A.spin) A.spin.rotation.y+=dt*14;
  if(A.acc&&A.acc.anim) A.acc.anim(A,dt,moving);
}

function ov(b){ return P.x-P.hw<b.x1&&P.x+P.hw>b.x0&&P.y<b.y1&&P.y+P.h>b.y0&&P.z-P.hw<b.z1&&P.z+P.hw>b.z0; }

function stepPlayer(h){
  const sn=Math.sin(cam.yaw), cs=Math.cos(cam.yaw);
  let ix=inp.x, iy=inp.y; const il=Math.hypot(ix,iy); if(il>1){ ix/=il; iy/=il; }
  const wx=-sn*iy+cs*ix, wz=-cs*iy-sn*ix;
  const sp=(G.speed||6.5)*(G.speedMul?G.speedMul():1);
  const k=Math.min(1,((P.onGround||P.fly)?(P.onGround&&P.ground&&P.ground.ice?2.2:16):7)*h);
  if(P.knock>0) P.knock-=h; else { P.vx+=(wx*sp-P.vx)*k; P.vz+=(wz*sp-P.vz)*k; }
  if(il>0.15) P.yaw=angLerp(P.yaw,Math.atan2(wx,wz),Math.min(1,14*h));
  if(P.fly){ const up=(inp.jumpHeld?1:0)-(inp.downHeld?1:0); P.vy+=(up*7-P.vy)*Math.min(1,14*h); }
  else if(P.fall){ P.vy=P.fall; }

    if(P.onGround) P.coyote=0.1; else P.coyote-=h;
    if(P.jumpBuf>0){ P.jumpBuf-=h; if(P.coyote>0){ P.vy=G.jumpV||11; P.coyote=0; P.jumpBuf=0; P.onGround=false; sfx('jump'); } }
  }
  const bx=G.query(P.x-2,P.x+2,P.y-2,P.y+3.8,P.z-2,P.z+2);
  let blocked=false, stepTop=-1e9;
  P.x+=P.vx*h;
  for(const b of bx){ if(!b.ramp&&ov(b)){ if(P.vx>0||(P.vx===0&&P.x<(b.x0+b.x1)/2)) P.x=b.x0-P.hw-1e-4; else P.x=b.x1+P.hw+1e-4; P.vx=0; blocked=true; if(b.y1>stepTop) stepTop=b.y1; } }

  P.y+=P.vy*h;

function camCollide(tx,ty,tz,dx,dy,dz,d){
  const ex=tx+dx*d, ey=ty+dy*d, ez=tz+dz*d;

    if(b.noCam) continue;

    list.push(b);
  }
  if(!list.length) return d;
  for(let s=0.6;s<d;s+=0.2){ const px=tx+dx*s, py=ty+dy*s, pz=tz+dz*s;
    for(const b of list){ if(px>b.x0-0.2&&px<b.x1+0.2&&py>b.y0-0.2&&py<b.y1+0.2&&pz>b.z0-0.2&&pz<b.z1+0.2) return Math.max(0.8,s-0.3); } }

    const bA=this.mkBase('bot0',0,'Base de Léo 🤖','#8fc6ff',6), bB=this.mkBase('bot1',9,'Base de Mia 🤖','#a7e08f',6);
    (S.egg.slots||[]).forEach((it,i)=>{ const s=this.home.slots[i]; if(!s||s.locked) return; const item=sanitizeItem(it); if(item) this.putInSlot(this.home,s,item); });
    const pad=mk(box(1.8,0.1,1.8),emat('#ffd23f','#7a5200'),false); pad.position.set(-9,0.05,3.4); sc.add(pad);
    this.padPos={x:-9,z:3.4}; this.padLbl=textSprite(256,72,0.6); this.padLbl.position.set(-9,1.5,3.4); sc.add(this.padLbl);
    this.nests=[];
    ZONES.forEach((Z,k)=>{ for(const side of [-1,1]){ const x=side*6.5, z=-16.5-25*k;
      const nm=nestMesh(); nm.position.set(x,0,z); sc.add(nm);
      const gm=guardMesh(Z.guard); sc.add(gm.g);
      const n={x,z,zone:k,egg:null,em:null,respawn:0};
      n.guard={m:gm.g,legs:gm.legs,hx:x,hz:z,x:x+side*2.2,z,spd:Z.spd,t:rand(0,2),wx:x,wz:z,stun:0,target:null,yaw:0,walk:0};
      this.nests.push(n); this.fillNest(n); } });
    this.bots=[this.mkBot('Léo',bA,1),this.mkBot('Mia',bB,2)];
    P.x=-9; P.y=0; P.z=1.5; P.yaw=Math.PI; cam.yaw=0;
    this.refreshBar();
    banner('Vole un œuf 🥚 et ramène-le à ta base !');
  },
  decor(k,z0,z1){
    for(let i=0;i<9;i++){ const side=Math.random()<0.5?-1:1, x=side*rand(10.5,15), z=rand(z0+1.5,z1-1.5), g=new THREE.Group();
      const add=(o,y)=>{ o.position.y=y; g.add(o); return o; };
      if(k===0){ add(mk(box(0.4,1.4,0.4),lam('#8a5a2b')),0.7); add(mk(box(1.8,1.4,1.8),lam('#3fae4a')),2); }
      else if(k===1){ add(mk(box(0.5,2,0.5),lam('#3f9a49')),1); add(mk(box(0.8,0.35,0.35),lam('#3f9a49')),1.2).position.x=0.5; add(mk(box(0.35,0.7,0.35),lam('#3f9a49')),1.55).position.x=0.75; }
      else if(k===2){ for(let j=0;j<3;j++) add(mk(cone(+(1.1-j*0.3).toFixed(1),1,8),lam('#2f7d4a')),1+j*0.7); add(mk(cone(0.35,0.4,8),lam('#ffffff')),2.75); }
      else { add(mk(box(1.4,1,1.2),lam('#3a2a2a')),0.5).rotation.y=rand(0,3); const lv=add(mk(box(1.6,0.06,1.6),emat('#ff6a1f','#ff3300'),false),0.03); lv.position.z=1.6; }
      g.position.set(x,0,z); this.scene.add(g); }
  },
  mkBase(owner,cx,name,col,n){
    const sc=this.scene, B={owner,cx,cz:9,slots:[],name};
    addBox(this,cx-3.6,0,5.4,cx+3.6,0.06,12.6,tmat(col),null,null,false);
    addBox(this,cx-3.6,0,12.4,cx+3.6,0.8,12.6,tmat('#ffffff'),null,null,false);
    addBox(this,cx-3.6,0,5.4,cx-3.4,0.8,12.4,tmat('#ffffff'),null,null,false);
    addBox(this,cx+3.4,0,5.4,cx+3.6,0.8,12.4,tmat('#ffffff'),null,null,false);
    const sg=textSprite(512,96,1.0); setSprite(sg,name); sg.position.set(cx,3.1,12.6); sc.add(sg);
    for(let i=0;i<n;i++){ const c=i%3, r=Math.floor(i/3), x=cx-2.2+c*2.2, z=7+r*2.3;
      const locked=owner==='me'&&i>=6&&!S.egg.big;
      const ped=mk(cyl(0.55,0.62,0.22,16),lam(locked?'#9b97b5':'#ffffff'),false); ped.position.set(x,0.11,z); sc.add(ped);
      const lbl=textSprite(256,64,0.42); lbl.position.set(x,1.9,z); sc.add(lbl);
      const s={x,z,item:null,mesh:null,ped,lbl,locked,i}; B.slots.push(s); this.updLabel(s); }
    this.bases.push(B); return B;
  },
  mkBot(name,B,maxZone){
    const A=makeAvatar(randomAvatar(),'🤖 '+name,{bat:true}); this.scene.add(A.root);
    const b={name,base:B,A,x:B.cx,z:8.5,yaw:Math.PI,carry:null,cm:null,state:'think',t:rand(1,4),spd:5.6,stun:0,maxZone,raidT:rand(45,70),tgt:null,isPlayer:false};
    for(let i=0;i<2;i++){ const r=Math.random()<0.7?'C':'R'; this.putInSlot(B,B.slots[i],{kind:'pet',r,sp:PETS[r][Math.floor(Math.random()*3)].id}); }
    return b;
  },
  inBase(B,x,z){ return Math.abs(x-B.cx)<3.6&&z>5.4&&z<12.6; },
  updLabel(s){
    const it=s.item;
    if(!it){ s.lbl.visible=s.locked; if(s.locked) setSprite(s.lbl,'🔒'); return; }
    s.lbl.visible=true;
    if(it.kind==='egg') setSprite(s.lbl,'🥚 '+Math.max(1,Math.ceil(it.t))+' s',null,RAR[it.r].fg);
    else setSprite(s.lbl,PET_BY_ID[it.sp].n,null,RAR[it.r].fg);
  },
  putInSlot(B,s,item){
    s.item=item; delete item.origin;
    const m=itemMesh(item); m.position.set(s.x,0.22,s.z); m.rotation.y=Math.PI; this.scene.add(m); s.mesh=m;
    this.updLabel(s); if(B===this.home) this.persistSoon();
  },
  takeFromSlot(B,s){
    const it=s.item; s.item=null; if(s.mesh){ this.scene.remove(s.mesh); s.mesh=null; }
    this.updLabel(s); if(B===this.home) this.persistSoon(); return it;
  },
  fillNest(n){ n.egg=newEgg(rollRarity(n.zone)); if(n.em) this.scene.remove(n.em); n.em=eggMesh(n.egg.r); n.em.position.set(n.x,0.2,n.z); this.scene.add(n.em); },
  takeFromNest(who,n){
    const it=n.egg; n.egg=null; if(n.em){ this.scene.remove(n.em); n.em=null; } n.respawn=7;
    this.pickup(who,it,{nest:n}); n.guard.target=who;
  },
  pickup(who,item,origin){
    item.origin=origin; who.carry=item; who.cm=itemMesh(item); who.cm.scale.setScalar(0.8); this.scene.add(who.cm);
    if(who.isPlayer){ $('hud').classList.add('carrying'); sfx('cp'); }
  },
  drop(who){
    const it=who.carry; if(!it) return; who.carry=null;
    if(who.cm){ this.scene.remove(who.cm); who.cm=null; }
    if(who.isPlayer) $('hud').classList.remove('carrying');
    this.returnItem(it);
  },
  returnItem(it){
    const o=it.origin; if(!o) return;
    if(o.nest){ const n=o.nest; if(!n.egg){ delete it.origin; n.egg=it; n.respawn=0; n.em=eggMesh(it.r); n.em.position.set(n.x,0.2,n.z); this.scene.add(n.em); } return; }
    if(o.base){ let s=o.slot; if(s.item||s.locked) s=o.base.slots.find(x=>!x.item&&!x.locked); if(s) this.putInSlot(o.base,s,it); }
  },
  carriedFrom(n){ if(this.me.carry&&this.me.carry.origin&&this.me.carry.origin.nest===n) return true;
    return this.bots.some(b=>b.carry&&b.carry.origin&&b.carry.origin.nest===n); },
  deliver(who,B){
    const it=who.carry; if(!it) return false;
    let s=B.slots.find(x=>!x.item&&!x.locked), extra='';
    if(!s){
      let w=null; for(const x of B.slots) if(x.item&&!x.locked&&(!w||RAR[x.item.r].rank<RAR[w.item.r].rank)) w=x;
      if(!w||RAR[w.item.r].rank>=RAR[it.r].rank){
        if(who.isPlayer){ if(this.fullWarnT<=0){ banner('Ta base est pleine ! 🔒 Agrandis-la ou ramène un œuf plus rare'); this.fullWarnT=4; } return false; }
        who.carry=null; if(who.cm){ this.scene.remove(who.cm); who.cm=null; } return true;
      }
      const old=this.takeFromSlot(B,w);
      if(who.isPlayer){ const v=RAR[old.r].sell; addCoins(v); extra=' ('+(old.kind==='egg'?'œuf':PET_BY_ID[old.sp].n)+' vendu +'+v+' 🪙)'; }
      s=w;
    }
    who.carry=null; if(who.cm){ this.scene.remove(who.cm); who.cm=null; }
    this.putInSlot(B,s,it);
    if(who.isPlayer){ $('hud').classList.remove('carrying'); sfx('buy'); burst(this.scene,s.x,1,s.z,RAR[it.r].c,12,4);
      banner((it.kind==='egg'?'Œuf '+RAR[it.r].n+' déposé ! 🐣':PET_BY_ID[it.sp].n+' est à toi ! 🎉')+extra); }
    return true;
  },
  hatch(B,s){
    const it=s.item, list=PETS[it.r]; it.kind='pet'; it.sp=list[Math.floor(Math.random()*list.length)].id; delete it.t;
    this.scene.remove(s.mesh); s.mesh=petMesh(it.sp); s.mesh.position.set(s.x,0.22,s.z); s.mesh.rotation.y=Math.PI; this.scene.add(s.mesh);
    this.updLabel(s); burst(this.scene,s.x,0.8,s.z,RAR[it.r].c,14,4);
    if(B===this.home){ sfx('gem'); banner('🐣 '+PET_BY_ID[it.sp].n+' '+RAR[it.r].n+' !'); this.persistSoon(); }
  },
  caught(who,fx,fz,msg){
    this.drop(who);
    if(who.isPlayer){ const dx=P.x-fx, dz=P.z-fz, d=Math.hypot(dx,dz)||1;
      P.vx=dx/d*9; P.vz=dz/d*9; P.vy=6; P.onGround=false; P.knock=0.3; P.inv=1; sfx('hurt'); flashHurt(); banner(msg); }
    else { who.stun=1.2; who.state='think'; who.t=1.5; who.tgt=null; }
  },
  moveTo(o,tx,tz,sp,dt){ const dx=tx-o.x, dz=tz-o.z, d=Math.hypot(dx,dz);
    if(d>0.001){ const st=Math.min(d,sp*dt); o.x+=dx/d*st; o.z+=dz/d*st; o.yaw=Math.atan2(dx,dz); return d-st; } return 0; },
  updGuard(n,dt){
    const g=n.guard; let mv=0;
    if(g.stun>0){ g.stun-=dt; g.m.rotation.y+=dt*8; g.m.position.set(g.x,0,g.z); return; }
    let tg=g.target;
    if(tg&&!(tg.carry&&tg.carry.origin&&tg.carry.origin.nest===n)) tg=g.target=null;
    if(tg&&Math.hypot(g.x-g.hx,g.z-g.hz)>28) tg=g.target=null;
    if(tg){ const tx=tg.isPlayer?P.x:tg.x, tz=tg.isPlayer?P.z:tg.z, ty=tg.isPlayer?P.y:0;
      const d=this.moveTo(g,tx,tz,g.spd,dt); mv=g.spd;
      if(d<1.3&&ty<1.6&&!(tg.isPlayer&&P.inv>0)){ this.caught(tg,g.x,g.z,'Attrapé ! L\'œuf retourne au nid'); g.target=null; } }
    else { const dh=Math.hypot(g.x-g.hx,g.z-g.hz);
      if(dh>4){ this.moveTo(g,g.hx,g.hz,3.2,dt); mv=3.2; }
      else { g.t-=dt; if(g.t<=0){ g.t=rand(1.5,3.5); const a=rand(0,TAU), r=rand(1.6,3.2); g.wx=g.hx+Math.cos(a)*r; g.wz=g.hz+Math.sin(a)*r; }
        if(this.moveTo(g,g.wx,g.wz,1.6,dt)>0.05) mv=1.6; } }
    g.x=clamp(g.x,-15.2,15.2);
    g.walk+=dt*mv*2.2; const sw=mv?Math.sin(g.walk)*0.6:0; g.legs[0].rotation.x=sw; g.legs[1].rotation.x=-sw;
    g.m.position.set(g.x,mv?Math.abs(Math.sin(g.walk))*0.08:0,g.z); g.m.rotation.y=g.yaw;
  },
  botDecide(b){
    const items=this.home.slots.filter(s=>s.item);
    if(b.raidT<=0&&items.length&&!this.bots.some(o=>o!==b&&o.state==='raid')){
      const eggs=items.filter(s=>s.item.kind==='egg'), pool=eggs.length&&Math.random()<0.7?eggs:items;
      b.tgt=pool[Math.floor(Math.random()*pool.length)]; b.state='raid'; b.raidT=rand(70,100);
      banner('⚠️ '+b.name+' 🤖 vient voler dans ta base !'); sfx('nope'); return;
    }
    let c=this.nests.filter(n=>n.egg&&n.zone<=b.maxZone&&!this.bots.some(o=>o!==b&&o.tgt===n));
    const easy=c.filter(n=>n.zone===0); if(easy.length&&Math.random()<0.65) c=easy;
    if(!c.length){ b.t=1; return; }
    b.tgt=c[Math.floor(Math.random()*c.length)]; b.state='nest';
  },
  updBot(b,dt){
    b.raidT-=dt; let sp=0;
    if(b.stun>0){ b.stun-=dt; b.A.root.rotation.y+=dt*12; b.A.root.position.set(b.x,0,b.z); animAvatar(b.A,dt,0,true); return; }
    const spd=b.spd*(b.carry?0.85:1);
    switch(b.state){
      case 'think': b.t-=dt; if(b.t<=0) this.botDecide(b); break;
      case 'nest': { const n=b.tgt; if(!n||!n.egg){ b.state='think'; b.t=0.3; b.tgt=null; break; } sp=spd;
        if(this.moveTo(b,n.x,n.z,spd,dt)<0.6){ this.takeFromNest(b,n); b.state='home'; b.tgt=null; } break; }
      case 'raid': { const s=b.tgt; if(!s||!s.item){ b.state='think'; b.t=0.5; b.tgt=null; break; } sp=spd;
        if(this.moveTo(b,s.x,s.z,spd,dt)<0.5){ const it=this.takeFromSlot(this.home,s); this.pickup(b,it,{base:this.home,slot:s}); b.state='home'; b.tgt=null;
          banner('😱 '+b.name+' a volé ton '+(it.kind==='egg'?'œuf':PET_BY_ID[it.sp].n)+' ! Tape-le avec ta batte 🏏'); sfx('hurt'); } break; }
      case 'home': sp=spd; if(this.moveTo(b,b.base.cx,8.5,spd,dt)<0.8){ this.deliver(b,b.base); b.state='think'; b.t=rand(1.5,3.5); } break;
      case 'chase': { const it=this.me.carry; if(!it||!it.origin||it.origin.base!==b.base){ b.state='think'; b.t=0.8; break; } sp=b.spd;
        const d=this.moveTo(b,P.x,P.z,b.spd,dt);
        if(d<1.1&&P.y<1.6&&P.inv<=0){ b.A.swing=0.28; this.caught(this.me,b.x,b.z,b.name+' a repris son bien !'); b.state='think'; b.t=1.5; } break; }
    }
    b.x=clamp(b.x,-15.5,15.5); b.z=clamp(b.z,-103.5,15.5);
    b.A.root.position.set(b.x,0,b.z); b.A.root.rotation.y=b.yaw; animAvatar(b.A,dt,sp,true);
    if(b.A.tag) b.A.tag.position.y=b.carry?3.55:2.78;
    if(b.cm){ b.cm.position.set(b.x,2.3,b.z); b.cm.rotation.y+=dt*1.5; }
  },
  onAction(){
    if(this.swingCd>0) return; this.swingCd=0.4; PA.swing=0.28; sfx('swing');
    let best=null, bd=4;
    for(const b of this.bots){ const d=Math.hypot(b.x-P.x,b.z-P.z); if(d<bd){ bd=d; best=b; } }
    for(const n of this.nests){ const g=n.guard, d=Math.hypot(g.x-P.x,g.z-P.z); if(d<bd){ bd=d; best=g; } }
    if(best) P.yaw=Math.atan2(best.x-P.x,best.z-P.z);
    let hit=false;
    for(const b of this.bots){ if(Math.hypot(b.x-P.x,b.z-P.z)>=2.7||b.stun>0) continue; hit=true;
      const it=b.carry, mine=it&&it.origin&&it.origin.base===this.home;
      b.stun=2; b.state='think'; b.t=2.5; b.tgt=null; this.drop(b); burst(this.scene,b.x,1.6,b.z,'#ffffff',8,4);
      if(mine) banner('Récupéré ! 💪'); }
    for(const n of this.nests){ const g=n.guard, d=Math.hypot(g.x-P.x,g.z-P.z); if(d>=3) continue; hit=true;
      g.stun=1.6; const k=d||1; g.x+=(g.x-P.x)/k*1.5; g.z+=(g.z-P.z)/k*1.5; burst(this.scene,g.x,2,g.z,'#ffffff',8,4); }
    if(hit) sfx('hit');
  },
  onTap(){ this.onAction(); },
  update(dt){
    const me=this.me; this.swingCd-=dt; if(this.fullWarnT>0) this.fullWarnT-=dt;
    for(const n of this.nests){ if(!n.egg){ n.respawn-=dt; if(n.respawn<=0&&!this.carriedFrom(n)) this.fillNest(n); } else if(n.em) n.em.rotation.y+=dt*0.8; }
    if(!me.carry&&P.y<1.5&&P.inv<=0){
      for(const n of this.nests) if(n.egg&&Math.hypot(P.x-n.x,P.z-n.z)<1.3){ this.takeFromNest(me,n); banner('Œuf '+RAR[me.carry.r].n+' ! Cours à ta base 🏠'); break; }
      if(!me.carry) outer: for(const B of this.bases){ if(B===this.home) continue;
        for(const s of B.slots) if(s.item&&Math.hypot(P.x-s.x,P.z-s.z)<1.0){
          const it=this.takeFromSlot(B,s); this.pickup(me,it,{base:B,slot:s}); banner('Volé ! Cours à ta base 🏃');
          const owner=this.bots.find(b=>b.base===B); if(owner&&!owner.carry&&owner.stun<=0){ owner.state='chase'; owner.tgt=null; }
          break outer; } }
    }
    if(me.carry&&this.inBase(this.home,P.x,P.z)) this.deliver(me,this.home);
    const bi=Math.floor(S.egg.bank);
    if(bi>=1&&Math.hypot(P.x-this.padPos.x,P.z-this.padPos.z)<1.3){ S.egg.bank-=bi; addCoins(bi); sfx('coin'); burst(this.scene,this.padPos.x,0.6,this.padPos.z,'#ffd23f',10,4); }
    setSprite(this.padLbl,'💰 '+Math.floor(S.egg.bank),null,'#ffd84d');
    for(const B of this.bases) for(const s of B.slots){ const it=s.item; if(!it) continue;
      if(it.kind==='egg'){ it.t-=dt; if(it.t<=0) this.hatch(B,s); else { const fast=it.t<3; s.mesh.rotation.z=Math.sin(this.time*(fast?20:6))*(fast?0.18:0.06); this.updLabel(s); } }
      else { s.mesh.position.y=0.22+Math.abs(Math.sin(this.time*3+s.i))*0.12; if(B===this.home) S.egg.bank+=RAR[it.r].inc*dt; } }
    if(me.cm){ me.cm.position.set(P.x,P.y+2.3,P.z); me.cm.rotation.y+=dt*1.5; }
    if(PA.tag) PA.tag.position.y=me.carry?3.55:2.78;
    for(const n of this.nests) this.updGuard(n,dt);
    for(const b of this.bots) this.updBot(b,dt);
    if(me.carry) pointCompass(this.home.cx,9,'Ta base');
    this.saveT+=dt; if(this.saveT>5){ this.saveT=0; this.persistSoon(); }
  },
  buySpeed(){
    const l=S.egg.lvl; if(l>=5) return; const c=SPEED_COST[l];
    if(S.coins<c){ banner('Il te faut '+c+' 🪙 pour aller plus vite'); sfx('nope'); return; }
    S.coins-=c; S.egg.lvl++; updateCoinsUI(true); sfx('buy'); banner('⚡ Vitesse niveau '+(S.egg.lvl+1)+' !'); this.refreshBar(); save();
  },
  buyPen(){
    if(S.egg.big) return;
    if(S.coins<PEN_COST){ banner('Il te faut '+PEN_COST+' 🪙 pour agrandir ta base'); sfx('nope'); return; }
    S.coins-=PEN_COST; S.egg.big=true; updateCoinsUI(true); sfx('buy'); banner('🏠 Base agrandie : 9 places !');
    for(const s of this.home.slots) if(s.locked){ s.locked=false; s.ped.material=lam('#ffffff'); this.updLabel(s); }
    this.refreshBar(); save();
  },
  refreshBar(){
    const l=S.egg.lvl;
    $('bSpeed').innerHTML=l>=5?'⚡ Vitesse MAX':'⚡ Vitesse niv. '+(l+2)+' · <span class="coin"></span>'+SPEED_COST[l];
    $('bPen').innerHTML=S.egg.big?'🏠 Base MAX':'🏠 Base +3 places · <span class="coin"></span>'+PEN_COST;
  },
  persistSoon(){ S.egg.slots=this.home.slots.map(s=>s.item?{k:s.item.kind,r:s.item.r,sp:s.item.sp||null,t:s.item.t||0}:null); saveSoon(); },
  stop(){
    for(const b of this.bots){ if(b.carry&&b.carry.origin&&b.carry.origin.base===this.home) this.drop(b); disposeAvatar(b.A); }
    $('hud').classList.remove('carrying'); this.persistSoon(); save();
  },
  hud(){
    const cap=S.egg.big?9:6, it=this.me.carry;
    setText('hPets',this.home.slots.filter(s=>s.item).length+'/'+cap);
    setText('hCarry',it?(it.kind==='egg'?'Œuf '+RAR[it.r].n:PET_BY_ID[it.sp].n):'Rien');
  }
};

  mkBot(name,B){

  moveTo(o,tx,tz,sp,dt){ const dx=tx-o.x, dz=tz-o.z, d=Math.hypot(dx,dz);

  botDecide(b){
    const B=b.base;

    const items=this.home.slots.filter(s=>s.id&&s.ready);
    if(b.raidT<=0&&items.length&&this.home.lockT<=0&&!this.bots.some(o=>o!==b&&o.state==='raid')){
      items.sort((a,c)=>BR_BY_ID[c.id].price-BR_BY_ID[a.id].price);
      b.tgt=Math.random()<0.6?items[0]:items[Math.floor(Math.random()*items.length)];

    }

    for(const w of this.walkers){ if(w.d.price>b.cash||w.x>22||this.bots.some(o=>o!==b&&o.tgt===w)) continue; if(!best||w.d.price>best.d.price) best=w; }
    if(best&&this.claimSlot(B,best.d)){ b.tgt=best; b.state='buy'; return; }

  updBot(b,dt){

      case 'buy': { const w=b.tgt; if(!w||this.walkers.indexOf(w)<0){ b.state='think'; b.t=0.5; b.tgt=null; break; } sp=spd;
        this.moveTo(b,w.x+0.8,B.dir*2.2,spd,dt);

      case 'raid': { const s=b.tgt; if(!s||!s.id||!s.ready){ b.state='think'; b.t=0.5; b.tgt=null; break; }
        if(this.home.lockT>0&&!this.inBase(this.home,b.x,b.z)){ b.state='think'; b.t=1; b.tgt=null; banner('🔒 '+b.name+' est bloqué par ta porte laser !'); break; }

      case 'home': sp=spd; if(this.moveTo(b,B.cx,B.cz,spd,dt)<1){ this.deliver(b,B); b.state='think'; b.t=rand(1.5,3); b.wx=undefined; } break;
      case 'chase': { const it=this.me.carry; if(!it||!it.origin||it.origin.base!==B){ b.state='think'; b.t=0.8; break; } sp=b.spd;

    b.A.root.position.set(b.x,0,b.z); b.A.root.rotation.y=b.yaw; animAvatar(b.A,dt,sp,true);
    if(b.A.tag) b.A.tag.position.y=b.carry?3.7:2.78;

  onAction(){

    let best=null, bd=4; for(const b of this.bots){ const d=Math.hypot(b.x-P.x,b.z-P.z); if(d<bd){ bd=d; best=b; } }
    if(best) P.yaw=Math.atan2(best.x-P.x,best.z-P.z);

      b.stun=2; b.state='think'; b.t=2.5; b.tgt=null; b.wx=undefined; this.drop(b); burst(this.scene,b.x,1.6,b.z,'#ffffff',8,4); sfx('hit');
      if(mine) banner('Récupéré ! 💪'); }
  },
  onTap(){ this.onAction(); },
  update(dt){

    for(let i=this.walkers.length-1;i>=0;i--){ const w=this.walkers[i]; w.x+=2.2*dt; w.t+=dt;
      w.m.position.set(w.x,0.05+Math.abs(Math.sin(w.t*5))*0.1,0); w.lbl.position.x=w.x; if(w.x>31.5) this.removeWalker(w); }

    let inc=0; for(const s of this.home.slots) if(s.id&&s.ready) inc+=BR_BY_ID[s.id].inc;
    this.inc=inc; S.br.bank+=inc*dt;
    const bi=Math.floor(S.br.bank);
    if(bi>=1&&Math.hypot(P.x-this.padPos.x,P.z-this.padPos.z)<1.3){ S.br.bank-=bi; S.br.cash+=bi; sfx('coin'); burst(this.scene,this.padPos.x,0.6,this.padPos.z,'#7dff7a',10,4); }

    if(PA.tag) PA.tag.position.y=me.carry?3.7:2.78;
    for(const b of this.bots) this.updBot(b,dt);
    const near=me.carry?null:this.nearWalker();
    const ic=me.carry?'🏏':near?'🛒':this.nearSteal()?'✋':'🏏';
    if(ic!==this.actIc){ this.actIc=ic; $('bAct').textContent=ic; }
    if(near&&!this.hintBuy){ this.hintBuy=true; banner(IS_TOUCH?'Appuie sur 🛒 pour l\'acheter':'Appuie sur E pour l\'acheter'); }
    if(me.carry) pointCompass(this.home.cx,this.home.cz,'Ta base');
    this.saveT+=dt; if(this.saveT>5){ this.saveT=0; this.persistSoon(); }
  },
  persistSoon(){ S.br.slots=this.home.slots.map(s=>s.id||null); saveSoon(); },
  stop(){
    for(const mv of this.movers) if(!mv.done&&mv.B===this.home){ mv.done=true; this.placeBR(mv.B,mv.s,mv.d.id); }
    for(const b of this.bots){ if(b.carry&&b.carry.origin&&b.carry.origin.base===this.home) this.drop(b); disposeAvatar(b.A); }
    $('hud').classList.remove('carrying'); this.persistSoon(); save();
  },
  hud(){ setText('hCash',fmtCash(S.br.cash)); setText('hInc','+'+fmtCash(this.inc)+'/s'); this.refreshLock(); }
};

function pickW(o){ let t=0; for(const k in o) t+=o[k]; let r=Math.random()*t; for(const k in o){ if(r<o[k]) return k; r-=o[k]; } return Object.keys(o)[0]; }

  if(!chest&&Math.random()<0.3){ const q=Math.random(); return q<0.45?{kind:'shield'}:q<0.8?{kind:'heal'}:{kind:'wood'}; }

  conBricks(){ const b=[], C=['#ff6b6b','#ffb020','#3ad17a','#4f7bff']; for(let j=0;j<4;j++) for(let i=0;i<8;i++) b.push({x:4+i*19,y:16+j*8,w:17,h:6,c:C[j],alive:true}); return b; },

  updConsole(dt){
    const c=this.con; if(!c) return; dt=Math.min(dt,0.05);
    if(c.scr==='play'){ const g=c.g;
      if(g.id==='snake'){ g.t+=dt; while(g.t>=g.step&&c.scr==='play'){ g.t-=g.step; g.dir=g.next; const h=[g.cells[0][0]+g.dir[0],g.cells[0][1]+g.dir[1]];
          if(h[0]<0||h[1]<0||h[0]>=16||h[1]>=11||g.cells.some((q,i)=>i<g.cells.length-1&&q[0]===h[0]&&q[1]===h[1])){ this.conOver(); break; }
          g.cells.unshift(h); if(h[0]===g.food[0]&&h[1]===g.food[1]){ g.score++; g.step=Math.max(0.07,g.step-0.004); this.conFood(g); this.cbeep(990); } else g.cells.pop(); } }
      else if(g.id==='brick'){ g.px=clamp(g.px+((this.conHeld('r')?1:0)-(this.conHeld('l')?1:0))*135*dt,0,132);

          if(g.bx<2){ g.bx=2; g.vx=Math.abs(g.vx); } if(g.bx>158){ g.bx=158; g.vx=-Math.abs(g.vx); } if(g.by<12){ g.by=12; g.vy=Math.abs(g.vy); }
          if(g.vy>0&&g.by>=105&&g.by<=111&&g.bx>=g.px-3&&g.bx<=g.px+31){ g.vy=-Math.abs(g.vy); g.vx=clamp((g.bx-(g.px+14))/14,-1,1)*85; this.cbeep(520,0.04); }
          for(const b of g.bricks) if(b.alive&&g.bx>b.x-2&&g.bx<b.x+b.w+2&&g.by>b.y-2&&g.by<b.y+b.h+2){ b.alive=false; g.vy=-g.vy; g.score+=10; this.cbeep(880,0.04); break; }
          if(g.by>122){ g.lives--; this.cbeep(200,0.2); if(g.lives<=0) this.conOver(); else g.stuck=true; }
          if(g.bricks.every(b=>!b.alive)){ g.lvl++; g.bricks=this.conBricks(); g.stuck=true; this.cbeep(1200,0.15); } } }
      else if(g.id==='fly'){ g.vy+=330*dt; g.y+=g.vy*dt; g.t-=dt;
        if(g.t<=0){ g.t=1.45; g.pipes.push({x:164,gap:26+Math.random()*56,passed:false}); }
        for(const p of g.pipes){ p.x-=56*dt; if(!p.passed&&p.x+14<35){ p.passed=true; g.score++; this.cbeep(990,0.04); }
          if(45>p.x&&35<p.x+14&&(g.y-5<p.gap-21||g.y+5>p.gap+21)) g.dead=true; }
        g.pipes=g.pipes.filter(p=>p.x>-20); if(g.y<5){ g.y=5; g.vy=Math.max(g.vy,0); } if(g.y>110) g.dead=true; if(g.dead) this.conOver(); }
      else if(g.id==='run'){ g.vy-=500*dt; g.y+=g.vy*dt; if(g.y<=0){ g.y=0; g.vy=0; }

        if(g.t<=0){ g.obs.push({x:164,w:6+Math.floor(Math.random()*6),h:8+Math.floor(Math.random()*12)}); g.t=0.75+Math.random()*1.05-Math.min(0.35,g.spd/700); }

  floorAt(x,y,z){

  seaTarget(c){

    for(let i=0;i<8;i++){

      if(c.kind==='whale'){ const cl=this.waterCol(x,z); if(!cl||cl[1]-cl[0]<6) continue; y=Math.random()<0.35?rand(10.15,10.6):rand(cl[0]+1.3,9.4); }

  seaPose(c,dt){

    if(p.tent) p.tent.forEach((q,i)=>{ if(!q.userData.b) q.userData.b=[q.rotation.x,q.rotation.z]; const b=q.userData.b, w=Math.sin(c.t*3+i)*0.25; q.rotation.x=b[0]+w; q.rotation.z=b[1]+w*0.6; });

    if(p.claws) p.claws.forEach((q,i)=>{ q.rotation.y=Math.sin(c.t*(c.snap>0?14:5)+i*2)*(c.snap>0?0.5:0.25); });

  crabStep(c,dt,d){
    c.wt-=dt; if(c.snap>0) c.snap-=dt;
    if(d<2.5){ const h=Math.hypot(P.x-c.x,P.z-c.z)||1; c.tx=c.x-(P.x-c.x)/h*3; c.tz=c.z-(P.z-c.z)/h*3; c.wt=1; }
    else if(c.wt<=0){ const a=rand(0,TAU), r=rand(1,3.5); c.tx=c.x+Math.cos(a)*r; c.tz=c.z+Math.sin(a)*r; c.wt=rand(2,5); }
    let ax=c.tx-c.x, az=c.tz-c.z; const al=Math.hypot(ax,az);

      if(fy!==null&&Math.abs(fy-c.y)<=1.01){ c.x=nx; c.z=nz; c.y+=(fy-c.y)*Math.min(1,10*dt); } else { c.wt=0; c.vx=c.vz=0; } }
    else c.vx=c.vz=0;

  updSea(dt){

        this.seaPose(c,dt); continue; }
      c.stuck=0; c.wt-=dt;
      const L=c.school&&c.school.lead;
      if(L&&L!==c&&!L.dead){ c.tx=L.x+c.ox; c.ty=L.y+c.oy*0.6; c.tz=L.z+c.oz; sp=K.sp*1.25; }

      if(c.flee>0){ c.flee-=dt; const h=Math.hypot(dx,dz)||1; c.tx=c.x-dx/h*4; c.tz=c.z-dz/h*4; c.ty=c.y; sp=K.sp*2.2; }

      else if(c.kind==='shark'&&surv&&this.inWater&&d<12&&c.cd<=0){ c.tx=P.x; c.ty=P.y+0.8; c.tz=P.z; sp=K.sp*1.7;
        if(d<1.6){ c.cd=1.8; c.flee=1.4; this.hurt(3,c.x,c.z); burst(sc,P.x,P.y+1,P.z,'#ffffff',6,3); } }
      else if(c.kind==='dolphin'&&d<7&&this.inWater){ c.tx=P.x+Math.sin(c.t*0.8)*2.5; c.ty=P.y+0.8; c.tz=P.z+Math.cos(c.t*0.8)*2.5; }
      let ax=c.tx-c.x, ay=c.ty-c.y, az=c.tz-c.z; const al=Math.hypot(ax,ay,az)||1; ax/=al; ay/=al; az/=al;

      if(c.kind==='whale'){ c.spout-=dt; if(c.spout<=0&&!this.seaLiq(c.x,c.y+1.6,c.z)){ c.spout=rand(6,12); const s_=Math.sin(c.yaw), co=Math.cos(c.yaw);

      if(sp>0){ const nx=e.x+wx*sp*dt, nz=e.z+wz*sp*dt; const ok=(x,z)=>{ const h=this.hgt(x,z); return h>0&&h<=e.y+1.05&&!this.solids.some(b=>x>b.x0-0.3&&x<b.x1+0.3&&z>b.z0-0.3&&z<b.z1+0.3&&b.y0<e.y+1&&b.y1>e.y+0.6); }; if(ok(nx,e.z)) e.x=nx; if(ok(e.x,nz)) e.z=nz; }

/* =========================================================
   10. Jeu à distance avec des copains (Monde de Blocs)
   Connexion directe entre téléphones (WebRTC via PeerJS).
   L'hôte garde le monde ; les invités reçoivent la graine
   et les blocs modifiés, puis chaque bloc posé ou cassé
   est envoyé aux autres.
   ========================================================= */
const NET_VER=2, NET_PREFIX='blocsmahe-v1-', NET_MAX=6, NET_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const NET_LIBS=['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
const NET_CHAT=['👋 Salut !','👍 D\'accord !','🏃 Viens ici !','👀 Regarde !','⛏️ On construit ?','🧟 Attention, monstres !','😂 Trop drôle !','❤️ Merci !','🏁 On fait la course ?','🎮 On change de jeu ?','🔁 On rejoue ?','🏆 Bien joué !'];
const NET={role:null,peer:null,host:null,code:'',conns:new Map(),players:new Map(),myId:'',world:null,wbuf:null,spawn:null,applying:false,out:[],sT:0,eT:0,dT:0,nid:0,busy:false,msg:'',err:'',tok:0,jt:0,starting:false,game:null,round:0,wait:{},scT:0,scV:'',bT:0,sw:false,lx:0,lz:0,lt:0};
function netCode(){ let s=''; for(let i=0;i<5;i++) s+=NET_ABC[Math.floor(Math.random()*NET_ABC.length)]; return s; }
function netLoadLib(){
  if(window.Peer) return Promise.resolve();
  return new Promise((res,rej)=>{ let i=0; const next=()=>{ if(window.Peer) return res(); if(i>=NET_LIBS.length) return rej({type:'lib'});
    const s=document.createElement('script'); s.src=NET_LIBS[i++]; s.async=true; let done=false;
    const t=setTimeout(()=>{ if(done) return; done=true; s.remove(); next(); },15000);
    s.onload=()=>{ if(done) return; done=true; clearTimeout(t); next(); };
    s.onerror=()=>{ if(done) return; done=true; clearTimeout(t); s.remove(); next(); };
    document.head.appendChild(s); }; next(); });
}
function netOpenPeer(id){
  return new Promise((res,rej)=>{
    let done=false, p;
    try{ p=id?new Peer(id,{debug:0}):new Peer({debug:0}); }catch(e){ rej({type:'browser-incompatible'}); return; }
    const t=setTimeout(()=>{ if(done) return; done=true; try{ p.destroy(); }catch(e){} rej({type:'timeout'}); },15000);
    p.on('open',()=>{ if(done) return; done=true; clearTimeout(t); res(p); });
    p.on('error',e=>{ if(!done){ done=true; clearTimeout(t); try{ p.destroy(); }catch(_){} rej(e||{}); } else if(NET.peer===p) netPeerError(e||{}); });
    p.on('disconnected',()=>{ setTimeout(()=>{ try{ if(NET.peer===p&&!p.destroyed&&p.disconnected) p.reconnect(); }catch(e){} },1500); });
  });
}
function netErrText(e){ const t=e&&e.type;
  if(t==='peer-unavailable') return 'Aucune partie avec ce code. Vérifie les lettres, et que ton copain est bien dans sa partie avec l\'écran allumé.';
  if(t==='lib') return 'Impossible de charger le jeu en ligne. Vérifie ta connexion Internet.';
  if(t==='browser-incompatible') return 'Ce navigateur ne permet pas le jeu en ligne. Ouvre Blocs Mahé dans Chrome ou Safari.';
  if(t==='connect') return 'La connexion avec ton copain n\'a pas marché. Essayez en Wi-Fi tous les deux, puis réessayez.';
  if(t==='full') return 'La partie est pleine ('+NET_MAX+' joueurs maximum).';
  if(t==='old') return 'Vous n\'avez pas la même version du jeu : fermez et rouvrez Blocs Mahé tous les deux.';
  return 'Impossible de joindre le serveur de connexion. Vérifie ta connexion Internet et réessaie.';
}
function netCleanName(n){ return (typeof n==='string'?n:'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,14)||'Copain'; }
function netCleanAv(a){ const d=DEF.avatar, o={}; a=a&&typeof a==='object'?a:{};
  for(const k of ['skin','shirt','pants','shoes']) o[k]=typeof a[k]==='string'&&/^#[0-9a-f]{6}$/i.test(a[k])?a[k]:d[k];
  o.face=FACES.some(f=>f.id===a.face)?a.face:d.face; o.hat=HATS.some(h=>h.id===a.hat)?a.hat:'none'; return o; }
function netAddPlayer(id,name,av){ const old=NET.players.get(id); if(old) netFreeP(old); const p={id,name:netCleanName(name),av:netCleanAv(av),A:null,s:null,veh:null,vk:'',k:0,st:0,sc:'',look:''}; NET.players.set(id,p); netBadge(); return p; }
function netFreeP(p){ if(p.A){ if(p.A.root.parent) p.A.root.parent.remove(p.A.root); disposeAvatar(p.A); p.A=null; } if(p.veh){ if(p.veh.g.parent) p.veh.g.parent.remove(p.veh.g); if(p.veh.free) p.veh.free(); p.veh=null; } p.vk=''; p.look=''; }
function netRemovePlayer(id){ const p=NET.players.get(id); if(!p) return; netFreeP(p); NET.players.delete(id); netBadge(); }
function netBadge(){ const b=$('netN'); if(b) b.textContent=String(NET.players.size+1); if(mode==='menu'&&typeof renderPlay==='function'&&$('pane-play')) rerender('pane-play',renderPlay); }
function netFeed(t){ if(mode!=='game'){ toast(t); return; } const f=$('netFeed'); if(!f) return; const d=el('div','nf'); d.textContent=t; f.appendChild(d); while(f.children.length>4) f.removeChild(f.children[0]); setTimeout(()=>{ if(d.parentNode) d.parentNode.removeChild(d); },7000); }
function netStatus(t){ NET.msg=t; netRender(); }
function netReset(){
  clearTimeout(NET.jt); NET.tok++;
  NET.players.forEach(p=>netFreeP(p)); NET.players=new Map(); NET.conns=new Map();
  Object.assign(NET,{role:null,peer:null,host:null,code:'',myId:'',world:null,wbuf:null,spawn:null,out:[],busy:false,msg:'',game:null,wait:{},scV:''});
  const nb=$('netBoard'); if(nb){ nb.innerHTML=''; nb.classList.remove('on'); }
  const h=$('hud'); if(h) h.classList.remove('net'); const c=$('netChat'); if(c) c.classList.remove('on'); netBadge();
}
function netLeave(quiet){
  const was=NET.role, peer=NET.peer, host=NET.host, conns=Array.from(NET.conns.values());
  if(was==='host') for(const c of conns){ try{ c.send({t:'end'}); }catch(e){} }
  netReset();
  setTimeout(()=>{ for(const c of conns){ try{ c.close(); }catch(e){} } try{ if(host) host.close(); }catch(e){} try{ if(peer) peer.destroy(); }catch(e){} },400);
  if((was==='host'||was==='guest')&&!quiet) banner('👋 Tu as quitté la partie en ligne');
  netRender(); if(typeof renderPlay==='function'&&mode!=='game') renderPlay();
}
function netFail(e){ const peer=NET.peer; netReset(); try{ if(peer) peer.destroy(); }catch(_){} NET.err=netErrText(e); netOpenPanel(); }
function netLost(msg){
  if(!NET.role) return; const guest=NET.role==='guest'; netLeave(true); banner(msg); sfx('nope');
  if(guest) setTimeout(()=>{ if(mode==='game'&&G&&G.id==='mc'&&G.netGuest) exitGame(); },2500);
  if(G) G.netR=0;
}
function netPeerError(e){ if(NET.role==='joining'&&e.type==='peer-unavailable') netFail(e); }
function netBroadcast(m,except){ NET.conns.forEach((c,k)=>{ if(k!==except){ try{ c.send(m); }catch(e){} } }); }
function netSend(m){ if(NET.role==='host'){ m.id='h'; netBroadcast(m,null); } else if(NET.role==='guest'&&NET.host){ try{ NET.host.send(m); }catch(e){} } }
/* ---------- créer une partie ---------- */
async function netHost(){
  if(NET.busy||NET.role) return; const tok=++NET.tok; NET.busy=true; NET.err=''; netStatus('⏳ Création de la partie…');
  try{
    await netLoadLib(); if(tok!==NET.tok) return;
    let p=null, code='';
    for(let i=0;i<5&&!p;i++){ code=netCode(); try{ p=await netOpenPeer(NET_PREFIX+code); }catch(e){ if(!e||e.type!=='unavailable-id') throw e; } if(tok!==NET.tok){ if(p) p.destroy(); return; } }
    if(!p) throw {type:'server'};
    Object.assign(NET,{peer:p,code,role:'host',myId:'h',nid:0,busy:false,msg:''});
    p.on('connection',c=>netAccept(c));
    if(mode==='game'&&G) netAdopt();
    $('hud').classList.toggle('net',mode==='game'); netBadge(); netRender();
    banner('👥 Partie ouverte ! Code : '+code); netFeed('🟢 Donne le code '+code+' à tes copains');
  }catch(e){ if(tok===NET.tok) netFail(e); }
}
function netAccept(c){
  let id=null;
  c.on('data',d=>{ try{
    if(!d||typeof d!=='object'||NET.role!=='host') return;
    if(!id){
      if(d.t!=='hello') return;
      if(d.v!==NET_VER){ c.send({t:'old'}); setTimeout(()=>c.close(),600); return; }
      if(NET.conns.size>=NET_MAX-1){ c.send({t:'full'}); setTimeout(()=>c.close(),600); return; }
      id='p'+(++NET.nid); const pl=netAddPlayer(id,d.name,d.av);
      const players=[{id:'h',name:S.name,av:S.avatar}]; NET.players.forEach((q,k)=>{ if(k!==id) players.push({id:k,name:q.name,av:q.av}); });
      c.send({t:'welcome',id,players});
      netBroadcast({t:'join',id,name:pl.name,av:pl.av},null);
      NET.conns.set(id,c); c.send({t:'ready'}); if(NET.game) netSendGo(c);
      netFeed('👋 '+pl.name+' a rejoint la partie'); sfx('cp'); netRender(); return;
    }
    netHandle(id,d);
  }catch(e){ console.warn(e); } });
  c.on('close',()=>{ if(id&&NET.conns.get(id)===c){ NET.conns.delete(id); const pl=NET.players.get(id); netRemovePlayer(id); netBroadcast({t:'bye',id},null); if(pl) netFeed('🚪 '+pl.name+' est parti'); netRender(); } });
  c.on('error',()=>{});
}
function netSendGo(c){
  const gm=NET.game; if(!gm) return;
  c.send({t:'go',g:gm.g,seed:gm.seed,r:gm.r,o:gm.o});
  netWelcomeTo(c);
  const g=G; if(gm.g!=='mc'||!g||g.id!=='mc'||!g.changes) return;
  const ch2=[]; g.changes.forEach(q=>q.m.forEach((v,i)=>ch2.push(q.cx*16+(i&15),i>>8,q.cz*16+((i>>4)&15),v)));
  const pos=P.y>MCH+2||P.y<-5?g.spawn:[+P.x.toFixed(2),+P.y.toFixed(2),+P.z.toFixed(2)];
  c.send({t:'mcw',world:{seed:g.seed,lt:Array.from(g.looted||[]).slice(0,5000),time:+(g.dayT||0).toFixed(4)},pos,n:ch2.length});
  for(let i=0;i<ch2.length;i+=4000) c.send({t:'ch',d:ch2.slice(i,i+4000)});
  c.send({t:'mcr'});
}
/* ---------- rejoindre ---------- */
async function netJoin(raw){
  if(NET.busy||NET.role) return;
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==5){ NET.err='Le code a 5 caractères (lettres et chiffres).'; netRender(); return; }
  const tok=++NET.tok; Object.assign(NET,{busy:true,err:'',code,role:'joining'}); netStatus('⏳ Connexion à la partie '+code+'…');
  try{
    await netLoadLib(); if(tok!==NET.tok) return;
    const p=await netOpenPeer(null); if(tok!==NET.tok){ try{ p.destroy(); }catch(e){} return; }
    NET.peer=p;
    const c=p.connect(NET_PREFIX+code,{reliable:true,serialization:'json'}); NET.host=c;

function palmMesh(h,lean,rng){
  const g=new THREE.Group(), tr=lam('#a8763f'), tr2=lam('#8a5a2b'), lf=lam('#3fbf5a'), lf2=lam('#2f9e48');
  let x=0, y=0; const n=6, seg=h/n;
  for(let i=0;i<n;i++){ const m=mk(box(0.36,+(seg+0.05).toFixed(2),0.36),i%2?tr:tr2); x=lean*Math.pow(i/n,1.6); m.position.set(x,y+seg/2,0); m.rotation.z=-lean*0.12*i/n; g.add(m); y+=seg; }
  const top=new THREE.Group(); top.position.set(x,y,0); g.add(top);
  for(let i=0;i<7;i++){ const a=i/7*TAU+rng()*0.3, f=new THREE.Group(); f.rotation.y=a; const l=mk(box(0.42,0.08,2.1),i%2?lf:lf2); l.position.set(0,0,1.0); l.rotation.x=0.42; f.add(l); const t=mk(box(0.3,0.06,0.9),i%2?lf2:lf); t.position.set(0,-0.55,2.15); t.rotation.x=0.9; f.add(t); top.add(f); }
  for(let i=0;i<3;i++){ const c=mk(sph(0.17),lam('#6b4a1e')); c.position.set(Math.cos(i*2.1)*0.25,-0.2,Math.sin(i*2.1)*0.25); top.add(c); }
  return {g,top:[x,y]};
}
function crabMesh(){
  const g=new THREE.Group(), R='#ff5a3c', D='#d63a22', add=(w,h,d,c,x,y,z)=>{ const m=mk(box(w,h,d),lam(c)); m.position.set(x,y,z); g.add(m); return m; };

    add(0.22,0.18,0.2,R,k*0.48,0.36,0.28); add(0.12,0.08,0.14,D,k*0.55,0.42,0.42); for(let j=0;j<3;j++) add(0.24,0.05,0.05,D,k*0.42,0.18,-0.15+j*0.14).rotation.z=k*0.5; }

}

   25. Jeu en ligne dans tous les jeux
   L'hôte crée une partie depuis l'accueil puis choisit n'importe
   quel jeu : les invités le suivent automatiquement. Le monde est
   le même chez tout le monde (graine commune : Math.random est
   remplacé par un générateur à graine pendant start() et les
   constructions), chacun voit l'avatar ou le héros des copains,
   un petit tableau des scores, les messages rapides et les fins
   de partie. Un nouveau jeu en profite sans rien faire ; il peut

let last=performance.now(), hudT=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000; last=now; if(!(dt>0)) return; if(dt>0.1) dt=0.1;
  bgmTick();
  if(mode==='menu'){ updateLobby(dt); gfxRender(lobby.scene); return; }
  if(!G) return;
  readInput();
  if(!G.over&&!PAUSE){
    G.time+=dt;
    if(G.preStep) G.preStep(dt);
    if(P.onGround&&P.ground&&P.ground.dx!==undefined){ P.x+=P.ground.dx; P.y+=P.ground.dy||0; P.z+=P.ground.dz||0; }
    if(inp.jumpHeld&&!P.fly) P.jumpBuf=Math.max(P.jumpBuf,0.05);
    if(!G.frozen){ const n=Math.ceil(dt/0.008), h=dt/n; for(let i=0;i<n;i++) stepPlayer(h); }
    if(G.update) G.update(dt);
  } else { P.vx*=0.9; P.vz*=0.9; if(G.idle) G.idle(dt); }
  if(!G) return;
  netTick(G,dt);
  PA.root.position.set(P.x,P.y,P.z); PA.root.rotation.y=P.yaw;
  animAvatar(PA,dt,Math.hypot(P.vx,P.vz),P.onGround||P.fly);
  if(P.inv>0){ P.inv-=dt; PA.root.visible=!G.fp&&Math.floor(P.inv*14)%2===0; } else PA.root.visible=!G.fp;
  updateParts(dt);
  autoCam(dt);
  updateCam(dt);
  envFrame(dt);
  sunGlow();
  const sun=G.scene.userData.sun, so=G.sunOff; if(sun){ sun.position.set(P.x+(so?so[0]:14),P.y+(so?so[1]:30),P.z+(so?so[2]:10)); sun.target.position.set(P.x,P.y,P.z); }
  hudT-=dt; if(hudT<=0){ hudT=0.15; G.hud(); hudFit(); }
  tutoTick(dt);
  gfxRender(G.scene);
  if(PHOTO.want) photoGrab();
  dailyTick(dt);
}

gfxApply(); refreshLobbyAvatar(); renderHome(); resize(); bgmPlay('menu');
requestAnimationFrame(t=>{ last=t; loop(t); });
})();
</script>
