<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#5ec8ff">
<title>Blocs Mahé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Monde unique et lumineux pour enfants : ciel 3D en fond, feuille de menus arrondie par-dessus. */
:root{--ink:#1d1846;--muted:#6d6896;--line:#ece9f7;--bg:#f7f5ff;--pink:#ff4f8b;--gold:#ffbf2e;--top:38vh;--sw:520px;color-scheme:light}
button:focus-visible,.name-in:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pill.bump,.shake,.box{animation:none!important}.card{transition:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3ff;font-family:'Baloo 2',ui-rounded,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.layer{position:fixed;inset:0;pointer-events:none;display:none}
.layer.on{display:block}
.ia{pointer-events:auto}

/* ---------- Home ---------- */
.topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:12px 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(29,24,70,.22);letter-spacing:.2px}
.logo svg{width:34px;height:34px;filter:drop-shadow(0 3px 0 rgba(29,24,70,.18))}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 14px 5px 8px;font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(29,24,70,.13);white-space:nowrap}
.pill.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.15)}}
.coin{display:inline-block;width:24px;height:24px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,#fff4b8 0 16%,#ffd34d 17% 58%,#e39b00 60%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 0 rgba(29,24,70,.13);flex:0 0 auto}
.iconbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(29,24,70,.13)}
.iconbtn.on{background:var(--ink)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:var(--top);background:var(--bg);border-radius:28px 28px 0 0;box-shadow:0 -6px 30px rgba(29,24,70,.18);display:flex;flex-direction:column;overflow:hidden}
body.land .sheet{top:0;left:auto;width:var(--sw);border-radius:28px 0 0 28px}
body.land .topbar{right:var(--sw)}
.tabs{display:flex;gap:6px;padding:12px 14px 8px}
.tab{flex:1;height:46px;border-radius:16px;font-weight:800;font-size:16px;color:var(--muted);background:#fff;box-shadow:0 3px 0 var(--line)}
.tab.on{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0b0820}
.pane{flex:1;overflow-y:auto;padding:4px 14px 28px;touch-action:pan-y;-webkit-overflow-scrolling:touch;display:none}
.pane.on{display:block}
.hi{margin:6px 2px 12px;font-size:21px;font-weight:800;line-height:1.15}
.hi span{color:var(--pink)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:340px){.cards{grid-template-columns:1fr}}
.card{position:relative;border-radius:22px;padding:14px 13px 12px;min-height:178px;color:#fff;text-align:left;display:flex;flex-direction:column;box-shadow:0 5px 0 rgba(29,24,70,.2);overflow:hidden;transition:transform .12s}
.card:active{transform:translateY(3px) scale(.98)}
.card::after{content:'';position:absolute;right:-22px;bottom:-26px;width:92px;height:92px;background:rgba(255,255,255,.17);border-radius:20px;transform:rotate(22deg)}
.card .ic{font-size:38px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.14))}
.card h3{margin:8px 0 3px;font-size:18.5px;line-height:1.08;font-weight:800}
.card p{margin:0;font-size:13.5px;line-height:1.22;font-weight:600;opacity:.96}
.card .best{margin-top:auto;padding-top:8px;font-size:12.5px;font-weight:800;position:relative;z-index:1}
.card .play{position:absolute;right:10px;top:10px;background:#fff;color:var(--ink);font-weight:800;border-radius:999px;padding:1px 11px;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.sec{margin:6px 0 16px}
.sec h4,.shop-h{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:42px;height:42px;border-radius:13px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 0 0 2px #fff,0 3px 0 2px var(--line);outline:3px solid transparent;outline-offset:2px}
.swatch.on{outline-color:var(--ink)}
.opt{width:76px;min-height:86px;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);box-shadow:0 3px 0 var(--line);border:3px solid transparent;padding:4px 3px}
.opt span:last-child{text-align:center;line-height:1.05}
.opt.on{border-color:var(--ink);color:var(--ink)}
.opt .em{font-size:30px;line-height:1}
.opt img{width:42px;height:42px;border-radius:9px}
.name-in{width:100%;height:50px;border-radius:15px;border:3px solid var(--line);padding:0 14px;font:inherit;font-size:19px;font-weight:700;color:var(--ink);background:#fff;outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.name-in:focus{border-color:var(--ink)}
.shop-note{color:var(--muted);font-weight:600;font-size:14.5px;margin:2px 2px 14px;line-height:1.3}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px;margin-bottom:18px}
.item{background:#fff;border-radius:18px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 3px 0 var(--line);border:3px solid transparent}
.item.on{border-color:var(--ink)}
.item .em{font-size:34px;height:44px;display:grid;place-items:center}
.item img{width:44px;height:44px;border-radius:10px}
.item .nm{font-weight:800;font-size:13.5px;text-align:center;line-height:1.08;min-height:29px;display:grid;place-items:center}
.item .pr{font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;background:#fff3cf;border-radius:999px;padding:1px 10px}
.item .pr .coin{width:16px;height:16px}
.item .pr.owned{background:#e5f8ec;color:#147a3c}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#toast{position:fixed;z-index:70;pointer-events:none;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:9px 18px;border-radius:999px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;z-index:3}
#toast.show{animation:toast 2.4s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ---------- HUD ---------- */
.hbtn{position:absolute;top:12px;left:12px}
.hud-top{position:absolute;top:12px;left:64px;right:112px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.hud-top .pill{font-size:16px;padding:5px 12px;gap:5px}
.hud-top .pill.warn{background:#ff4f6d;color:#fff}
.hud-coins{position:absolute;top:12px;right:12px}
.heart{width:20px;height:19px;display:block}
#hHearts{gap:2px;padding:6px 10px}
#joy{position:absolute;left:22px;bottom:26px;width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.24);border:3px solid rgba(255,255,255,.7);display:none;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:0 4px 0 rgba(29,24,70,.22);transform:translate(-50%,-50%);pointer-events:none}
.rbtn{position:absolute;border-radius:50%;background:rgba(255,255,255,.94);display:none;place-items:center;box-shadow:0 5px 0 rgba(29,24,70,.22);touch-action:none}
.rbtn.down{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,24,70,.22)}
.rbtn svg{width:46%;height:46%}
#bJump{right:22px;bottom:34px;width:90px;height:90px}
#bAct{right:126px;bottom:44px;width:74px;height:74px;font-size:32px}
#bDown{right:35px;bottom:138px;width:64px;height:64px}
body.touch #joy{display:block}
body.touch #bJump{display:grid}
body.touch #hud[data-g="arena"] #bAct{display:grid}
body.touch #hud.flying #bDown{display:grid}
.kbd-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(29,24,70,.55);color:#fff;font-weight:600;font-size:14px;padding:6px 16px;border-radius:999px;white-space:nowrap}
body.touch .kbd-hint{display:none}
#buildBar{position:absolute;top:66px;left:10px;right:10px;display:none;flex-direction:column;gap:8px;align-items:center}
#hud[data-g="build"] #buildBar{display:flex}
.brow{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:#fff;border-radius:16px;padding:4px;gap:4px;box-shadow:0 4px 0 rgba(29,24,70,.13)}
.seg button{height:38px;padding:0 13px;border-radius:12px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.palette{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:5px;background:rgba(255,255,255,.88);border-radius:16px;touch-action:pan-x;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.palette button{flex:0 0 auto;width:36px;height:36px;border-radius:10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);border:3px solid transparent}
.palette button.on{border-color:var(--ink);transform:scale(1.08)}
#compass{position:absolute;top:64px;left:50%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center}
#hud[data-g="island"] #compass{display:flex}
#hud[data-g="eggs"].carrying #compass{display:flex;top:116px}
#hud[data-g="mc"].nav #compass{display:flex;top:158px}
#compass2{position:absolute;top:158px;left:50%;transform:translateX(34px);display:none;flex-direction:column;align-items:center}
#hud[data-g="mc"].nav2 #compass2{display:flex}
#hud[data-g="mc"].nav.nav2 #compass{transform:translateX(calc(-100% - 34px))}
#compass2 .arrow{width:54px;height:54px;border-radius:50%;background:#fff3c4;display:grid;place-items:center;box-shadow:0 4px 0 rgba(29,24,70,.15)}
#compass2 svg{width:30px;height:30px}
#compass2 .dist{margin-top:3px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(29,24,70,.4);font-size:14px}
.bubble{background:#fff6d6;border-radius:16px;padding:10px 14px;color:var(--ink)!important;font-size:16px!important;font-weight:700!important}
#eggBar{position:absolute;top:66px;left:10px;right:10px;display:none;justify-content:center;gap:8px;flex-wrap:wrap}
#hud[data-g="eggs"] #eggBar{display:flex}
.ubtn{height:40px;padding:0 13px;border-radius:14px;background:#fff;font-weight:800;font-size:14.5px;box-shadow:0 4px 0 rgba(29,24,70,.13);display:inline-flex;align-items:center;gap:5px}
.ubtn .coin{width:18px;height:18px}
.ubtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(29,24,70,.13)}
body.touch #hud[data-g="eggs"] #bAct{display:grid}
#hud[data-g="brainrot"].carrying #compass{display:flex;top:116px}
#brBar{position:absolute;top:66px;left:10px;right:10px;display:none;justify-content:center}
#hud[data-g="brainrot"] #brBar{display:flex}
#bLock.on{background:#ff4f6d;color:#fff}
body.touch #hud[data-g="brainrot"] #bAct{display:grid}
#royale{display:none}
#hud[data-g="royale"] #royale{display:block}
#royale>*{position:absolute}
#miniMap{top:62px;right:12px;width:100px;height:100px;border-radius:14px;border:3px solid #fff;box-shadow:0 4px 0 rgba(29,24,70,.15);background:#4fb4ff}
#feed{top:64px;left:12px;display:flex;flex-direction:column;gap:4px;max-width:44vw}
#feed div{background:rgba(29,24,70,.6);color:#fff;font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bars{top:104px;left:50%;transform:translateX(-50%);width:170px;display:grid;gap:4px}
.bar{height:10px;border-radius:99px;background:rgba(29,24,70,.35);overflow:hidden;border:2px solid #fff}
.bar i{display:block;height:100%;width:100%;transition:width .15s}
#hpBar{background:#3ad17a}#shBar{background:#4fa8ff}
#hotbar{left:14px;bottom:182px;display:flex;flex-direction:column;gap:6px}
#hotbar button{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.9);border:3px solid transparent;font-size:24px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(29,24,70,.18)}
#hotbar button.on{outline:3px solid var(--ink);outline-offset:1px}
@media (min-aspect-ratio:1/1){#hotbar{left:50%;transform:translateX(-50%);bottom:14px;flex-direction:row}}
#crosshair{left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px rgba(29,24,70,.35)}
#crosshair::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#fff}
#crosshair.hit{border-color:#ff3d6e;transform:scale(1.35)}
#hud.bus #crosshair{display:none}
#stormFx{inset:0;background:radial-gradient(transparent 30%,rgba(150,60,230,.55));opacity:0;transition:opacity .4s}
#bFire{right:126px;bottom:40px;width:84px;height:84px;font-size:34px;background:#ff4f6d!important}
#bBuild{right:30px;bottom:140px;width:58px;height:58px;font-size:26px}
#bpBtns{right:26px;bottom:206px;display:none;flex-direction:column;gap:8px}
#bpBtns .rbtn{position:static;display:grid;width:56px;height:56px;font-size:26px}
#hud.building #bpBtns{display:flex}
#hud.building #bBuild{background:var(--ink)!important}
body.touch #hud[data-g="royale"] #bFire,#hud[data-g="royale"] #bBuild{display:grid}
@media (min-aspect-ratio:1/1){body.touch #hotbar{bottom:14px}}
#mc{display:none}
#hud[data-g="mc"] #mc{display:block}
#mc>*{position:absolute}
body.touch #hud[data-g="mc"] #bAct{display:grid}
#mcBar{top:108px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
#mcBar .iconbtn{width:42px;height:42px;font-size:19px}
@media (max-width:420px){#mcBar{gap:3px}#mcBar .iconbtn{width:35px;height:35px;font-size:16px}}
#mcExitV{top:160px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;padding:10px 18px;background:#fff;color:#1d1846;font:inherit;font-weight:800;font-size:16px;box-shadow:0 4px 0 rgba(29,24,70,.2);cursor:pointer;z-index:4}
#mcCon{top:160px;bottom:12px;max-height:620px;left:50%;transform:translateX(-50%);width:min(330px,92vw);display:none;flex-direction:column;align-items:center;gap:8px;z-index:5;background:linear-gradient(160deg,#7b4ff0,#5a2fc2);border-radius:30px 30px 56px 30px;padding:14px 14px 12px;box-shadow:0 10px 0 rgba(29,24,70,.28),inset 0 -6px 0 rgba(0,0,0,.18)}
#mcCon.on{display:flex}
.cn-scr{width:100%;background:#1d1846;border-radius:16px;padding:9px;box-shadow:inset 0 0 0 3px #3b3466;flex:none}
#cnCv{width:100%;aspect-ratio:4/3;display:block;image-rendering:pixelated;border-radius:6px;background:#0d0b26}
.cn-brand{color:#ffd23f;font-weight:900;letter-spacing:2px;font-size:13px;text-shadow:0 2px 0 rgba(0,0,0,.25);flex:none}
.cn-ctl{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 4px;flex:1;min-height:0}
.cn-pad{position:relative;width:114px;height:114px;flex:none}
.cn-pad:after{content:'';position:absolute;left:38px;top:38px;width:38px;height:38px;background:#2b2160;border-radius:4px}
.cn-d{position:absolute;width:38px;height:38px;border:0;background:#2b2160;color:#cfc6ff;font-size:15px;border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.3);touch-action:none;cursor:pointer;z-index:1}
.cn-d.u{left:38px;top:0}.cn-d.d{left:38px;bottom:0}.cn-d.l{left:0;top:38px}.cn-d.r{right:0;top:38px}
.cn-ab{position:relative;width:118px;height:106px;flex:none}
.cn-a,.cn-b{position:absolute;width:54px;height:54px;border-radius:50%;border:0;font:inherit;font-weight:900;font-size:20px;color:#1d1846;box-shadow:0 4px 0 rgba(0,0,0,.3);touch-action:none;cursor:pointer}
.cn-a{right:0;top:4px;background:#ffd23f}.cn-b{left:0;bottom:4px;background:#ff8fc7}
.cn-d.on,.cn-a.on,.cn-b.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.cn-sys{display:flex;gap:14px;flex:none}
.cn-s{border:0;border-radius:999px;padding:7px 14px;background:#2b2160;color:#fff;font:inherit;font-weight:800;font-size:12px;cursor:pointer}
#hud:not(.creative) #mcFly{display:none}
body:not(.touch) #mcTap{display:none}
#mcHearts{gap:1px;padding:6px 10px}
#mcHearts .heart{width:14px;height:13px}
#mcCross{left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px}
#mcCross::before,#mcCross::after{content:'';position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(29,24,70,.4)}
#mcCross::before{left:9px;top:2px;width:2px;height:16px}
#mcCross::after{top:9px;left:2px;height:2px;width:16px}
#mcRing{width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;display:none;background:conic-gradient(#fff calc(var(--p,0)*1turn),rgba(255,255,255,.25) 0);-webkit-mask:radial-gradient(transparent 52%,#000 54%);mask:radial-gradient(transparent 52%,#000 54%)}
#mcHot{left:50%;transform:translateX(-50%);bottom:178px;display:flex;gap:3px;background:rgba(29,24,70,.35);padding:4px;border-radius:14px}
#mcHot button{width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.88);border:3px solid transparent;position:relative;padding:0;display:grid;place-items:center}
#mcHot button img{width:24px;height:24px;image-rendering:pixelated;display:block}
#mcHot button.on{border-color:#ffd23f;background:#fff}
#mcHot b{position:absolute;right:2px;bottom:0;font-size:11px;color:#1d1846;font-weight:800}
@media (min-aspect-ratio:1/1){#mcHot{bottom:12px}}
body:not(.touch) #mcHot{bottom:12px}
#mcUnder{inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background-color:rgba(40,130,235,.13);background-size:192px 192px;image-rendering:pixelated;box-shadow:inset 0 0 90px rgba(0,30,90,.32);animation:mcuw 9s linear infinite}
#mcUnder.on{opacity:1}
@keyframes mcuw{from{background-position:0 0}to{background-position:192px 96px}}
#sleepFx{inset:0;background:#0b0820;opacity:0;transition:opacity .8s;display:grid;place-items:center;font-size:64px;color:#fff;pointer-events:none;z-index:3}
#sleepFx.on{opacity:1}
#mcPhoneUI{top:160px;bottom:12px;max-height:640px;left:50%;transform:translateX(-50%);width:min(300px,88vw);display:none;flex-direction:column;z-index:5;background:#1d1846;border-radius:40px;padding:10px 10px 6px;box-shadow:0 10px 0 rgba(29,24,70,.25),inset 0 0 0 2px #3b3466}
#mcPhoneUI.on{display:flex}
.ph-scr{flex:1;min-height:0;border-radius:30px;overflow:hidden;background:linear-gradient(165deg,#5ec4ff,#9b7bff 55%,#ff8fc7);display:flex;flex-direction:column;color:#fff;position:relative}
.ph-scr.cam{background:transparent;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.ph-notch{width:86px;height:18px;background:#1d1846;border-radius:0 0 14px 14px;margin:0 auto;flex:none}
.ph-bar{display:flex;justify-content:space-between;padding:0 18px 4px;font-weight:800;font-size:13px;margin-top:-14px;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ph-wall{text-align:center;padding:14px 0 4px;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.ph-big{font-size:46px;font-weight:900;line-height:1}
.ph-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;padding:14px 10px}
.ph-app{background:none;border:0;color:#fff;font:inherit;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.3)}

    g.beginPath(); g.ellipse(100,80,11,7,0,0,TAU); g.fill(); g.fillStyle=ink; };

    g.lineWidth=3; g.stroke(); g.lineWidth=7; g.fillStyle=ink; };
  const openMouth=()=>{ g.beginPath(); g.moveTo(42,76); g.quadraticCurveTo(64,108,86,76); g.closePath(); g.fill(); };

    case 'wink': blush(); eye(44,54,10); g.beginPath(); g.moveTo(74,57); g.quadraticCurveTo(84,47,94,57); g.stroke();
      g.beginPath(); g.arc(64,72,21,0.2*Math.PI,0.8*Math.PI); g.stroke(); break;

      g.beginPath(); g.moveTo(48,88); g.quadraticCurveTo(70,97,88,81); g.stroke(); break;
    case 'star': blush(); star(44,54,16); star(84,54,16); openMouth(); break;

      g.fillStyle=ink; for(let i=0;i<5;i++) g.fillRect(38+i*11,84,6,15); break;

function animAvatar(A,dt,spd,grounded){
  A.t+=dt; const k=damp(16,dt);

  const amp=moving?Math.min(1,spd/6.5)*0.85:0, s=Math.sin(A.walk);
  let la=s*amp, ra=-s*amp, ll=-s*amp, rl=s*amp, laz=0;
  if(!grounded){ la=-2.7; ra=-2.7; ll=0.35; rl=-0.25; }
  if(A.sword) ra=grounded?-0.55+(moving?s*0.25:0):-1.2;
  if(A.waveT>0){ A.waveT-=dt; laz=2.6+Math.sin(A.t*16)*0.3; la=0; }
  if(A.aim){ ra=-1.5; la=-1.3; laz=-0.35; }
  if(A.sit){ la=-1.1; ra=-1.1; ll=-1.5; rl=-1.5; laz=0; }
  A.arms[0].rotation.x=lerp(A.arms[0].rotation.x,la,k);
  A.arms[0].rotation.z=lerp(A.arms[0].rotation.z,laz,k);
  if(A.swing>0){ A.swing-=dt; const p=1-Math.max(0,A.swing)/0.28, e=1-Math.pow(1-p,3); A.arms[1].rotation.x=lerp(-2.9,-0.25,e); }
  else A.arms[1].rotation.x=lerp(A.arms[1].rotation.x,ra,k);
  A.legs[0].rotation.x=lerp(A.legs[0].rotation.x,ll,k);
  A.legs[1].rotation.x=lerp(A.legs[1].rotation.x,rl,k);
  A.body.position.y=A.sit?0:moving?Math.abs(Math.cos(A.walk))*0.07:Math.sin(A.t*2.2)*0.012;
  if(A.spin) A.spin.rotation.y+=dt*14;
}

  for(let i=0;i<n;i++){ const m=new THREE.Mesh(box(0.16,0.16,0.16),mt); m.position.set(x,y,z); sc.add(m);
    PARTS.push({m,sc,vx:rand(-1,1)*spd,vy:rand(0.3,1.2)*spd,vz:rand(-1,1)*spd,life:rand(0.45,0.85)}); }
}
function updateParts(dt){
  for(let i=PARTS.length-1;i>=0;i--){ const p=PARTS[i]; p.life-=dt;
    if(p.life<=0){ p.sc.remove(p.m); PARTS.splice(i,1); continue; }
    p.vy-=18*dt; p.m.position.x+=p.vx*dt; p.m.position.y+=p.vy*dt; p.m.position.z+=p.vz*dt;
    p.m.rotation.x+=dt*6; p.m.rotation.y+=dt*4; p.m.scale.setScalar(Math.min(1,p.life*2)); }
}
function clearParts(){ for(const p of PARTS) p.sc.remove(p.m); PARTS.length=0; }

function makeCoin(G,x,y,z){
  const g=new THREE.Group(); const m=mk(cyl(0.36,0.36,0.09,18),coinMat()); m.rotation.x=Math.PI/2; g.add(m);
  g.position.set(x,y,z); G.scene.add(g); const c={g,x,y,z,t:Math.random()*6,taken:false}; G.coins.push(c); return c;
}
function updateCoins(G,dt,val,magnet){
  const cy=P.y+0.9; let any=false;
  for(const c of G.coins){ if(c.taken) continue; c.t+=dt; c.g.rotation.y+=dt*3.2;
    const dx=P.x-c.x, dy=cy-c.y, dz=P.z-c.z, d=Math.hypot(dx,dy,dz);
    if(magnet&&d<3.6&&d>0.01){ const s=Math.min(d,12*dt)/d; c.x+=dx*s; c.y+=dy*s; c.z+=dz*s; }
    c.g.position.set(c.x,c.y+Math.sin(c.t*2.2)*0.12,c.z);
    if(d<1.15){ c.taken=true; any=true; G.scene.remove(c.g); addCoins(val); sfx('coin'); burst(G.scene,c.x,c.y,c.z,'#ffd23f',6,3); } }
  if(any) G.coins=G.coins.filter(c=>!c.taken);
}

function readInput(){
  if(G&&G.panel==='console'){ inp.x=inp.y=0; inp.jumpHeld=false; inp.downHeld=false; return; }
  const kx=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0);
  const ky=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0);
  inp.x=kx||joy.x; inp.y=ky||joy.y;
  inp.jumpHeld=jumpHeld||keys.has('Space');
  inp.downHeld=downHeld||keys.has('ShiftLeft')||keys.has('ShiftRight');
}
function ov(b){ return P.x-P.hw<b.x1&&P.x+P.hw>b.x0&&P.y<b.y1&&P.y+P.h>b.y0&&P.z-P.hw<b.z1&&P.z+P.hw>b.z0; }
function touching(b){ return P.x-P.hw<b.x1+0.03&&P.x+P.hw>b.x0-0.03&&P.y<b.y1+0.03&&P.y+P.h>b.y0&&P.z-P.hw<b.z1+0.03&&P.z+P.hw>b.z0-0.03; }
function stepPlayer(h){
  const sn=Math.sin(cam.yaw), cs=Math.cos(cam.yaw);
  let ix=inp.x, iy=inp.y; const il=Math.hypot(ix,iy); if(il>1){ ix/=il; iy/=il; }
  const wx=-sn*iy+cs*ix, wz=-cs*iy-sn*ix;
  const sp=(G.speed||6.5)*(G.speedMul?G.speedMul():1);
  const k=Math.min(1,((P.onGround||P.fly)?(P.onGround&&P.ground&&P.ground.ice?2.2:16):7)*h);
  if(P.knock>0) P.knock-=h; else { P.vx+=(wx*sp-P.vx)*k; P.vz+=(wz*sp-P.vz)*k; }
  if(il>0.15) P.yaw=angLerp(P.yaw,Math.atan2(wx,wz),Math.min(1,14*h));
  if(P.fly){ const up=(inp.jumpHeld?1:0)-(inp.downHeld?1:0); P.vy+=(up*7-P.vy)*Math.min(1,14*h); }
  else if(P.fall){ P.vy=P.fall; }
  else {
    P.vy-=30*(G.grav||1)*h; if(P.vy<-30) P.vy=-30;
    if(P.onGround) P.coyote=0.1; else P.coyote-=h;
    if(P.jumpBuf>0){ P.jumpBuf-=h; if(P.coyote>0){ P.vy=G.jumpV||11; P.coyote=0; P.jumpBuf=0; P.onGround=false; sfx('jump'); } }
  }
  const bx=G.query(P.x-2,P.x+2,P.y-2,P.y+3.8,P.z-2,P.z+2);
  let blocked=false, stepTop=-1e9;
  P.x+=P.vx*h;
  for(const b of bx){ if(!b.ramp&&ov(b)){ if(P.vx>0||(P.vx===0&&P.x<(b.x0+b.x1)/2)) P.x=b.x0-P.hw-1e-4; else P.x=b.x1+P.hw+1e-4; P.vx=0; blocked=true; if(b.y1>stepTop) stepTop=b.y1; } }
  P.z+=P.vz*h;
  for(const b of bx){ if(!b.ramp&&ov(b)){ if(P.vz>0||(P.vz===0&&P.z<(b.z0+b.z1)/2)) P.z=b.z0-P.hw-1e-4; else P.z=b.z1+P.hw+1e-4; P.vz=0; blocked=true; if(b.y1>stepTop) stepTop=b.y1; } }
  const was=P.onGround; P.onGround=false; P.ground=null;
  P.y+=P.vy*h;
  for(const b of bx){ if(!b.ramp&&ov(b)){ if(P.vy<=0){ P.y=b.y1; P.onGround=true; P.ground=b; } else P.y=b.y0-P.h-1e-4; P.vy=0; } }
  for(const b of bx){ if(!b.ramp||P.x<b.x0||P.x>b.x1||P.z<b.z0||P.z>b.z1) continue;
    const sy=b.ramp(P.x,P.z); if(P.vy<=0&&P.y<sy+0.06&&P.y>sy-0.9){ P.y=sy; P.vy=0; P.onGround=true; P.ground=b; } }
  if(blocked&&was&&G.autoJump&&il>0.3&&!P.fly){ const d=stepTop-P.y; if(d>0.05&&d<=1.05){ P.vy=8.6; P.onGround=false; } }
  if(G.bounds){ const B=G.bounds; P.x=clamp(P.x,B[0],B[1]); P.z=clamp(P.z,B[2],B[3]); }
}
function camCollide(tx,ty,tz,dx,dy,dz,d){
  const ex=tx+dx*d, ey=ty+dy*d, ez=tz+dz*d;
  const ax0=Math.min(tx,ex), ax1=Math.max(tx,ex), ay0=Math.min(ty,ey), ay1=Math.max(ty,ey), az0=Math.min(tz,ez), az1=Math.max(tz,ez);
  const list=[];
  for(const b of G.query(ax0-0.5,ax1+0.5,ay0-0.5,ay1+0.5,az0-0.5,az1+0.5)){
    if(b.noCam) continue;
    if(b.x1<ax0-0.3||b.x0>ax1+0.3||b.y1<ay0-0.3||b.y0>ay1+0.3||b.z1<az0-0.3||b.z0>az1+0.3) continue;
    list.push(b);
  }
  if(!list.length) return d;
  for(let s=0.6;s<d;s+=0.2){ const px=tx+dx*s, py=ty+dy*s, pz=tz+dz*s;
    for(const b of list){ if(px>b.x0-0.2&&px<b.x1+0.2&&py>b.y0-0.2&&py<b.y1+0.2&&pz>b.z0-0.2&&pz<b.z1+0.2) return Math.max(0.8,s-0.3); } }
  return d;
}
function updateCam(dt){
  if(G.fp){
    const cp0=Math.cos(cam.pitch); cam.fx=-Math.sin(cam.yaw)*cp0; cam.fy=-Math.sin(cam.pitch); cam.fz=-Math.cos(cam.yaw)*cp0;
    cam.px=P.x; cam.py=P.y+1.62; cam.pz=P.z; cam.tx=P.x; cam.ty=P.y+1.55; cam.tz=P.z; cam.d=0;
    camera.position.set(cam.px,cam.py,cam.pz); camera.lookAt(cam.px+cam.fx,cam.py+cam.fy,cam.pz+cam.fz); return;
  }
  const k=damp(14,dt);
  cam.tx=lerp(cam.tx,P.x,k); cam.tz=lerp(cam.tz,P.z,k); cam.ty=lerp(cam.ty,P.y+1.55,damp(9,dt));
  const sh=G.shoulder||0, tx=cam.tx+Math.cos(cam.yaw)*sh, ty=cam.ty, tz=cam.tz-Math.sin(cam.yaw)*sh;
  const cp=Math.cos(cam.pitch), dx=Math.sin(cam.yaw)*cp, dy=Math.sin(cam.pitch), dz=Math.cos(cam.yaw)*cp;
  const want=camCollide(tx,ty,tz,dx,dy,dz,cam.dist);
  if(want<cam.d) cam.d=want; else cam.d=lerp(cam.d,want,damp(5,dt));
  cam.px=tx+dx*cam.d; cam.py=ty+dy*cam.d; cam.pz=tz+dz*cam.d; cam.fx=-dx; cam.fy=-dy; cam.fz=-dz;
  camera.position.set(cam.px,cam.py,cam.pz);
  camera.lookAt(tx,ty,tz);
}
function snapCam(){ cam.tx=P.x; cam.ty=P.y+1.55; cam.tz=P.z; }
function pointCompass(tx,tz,label,n){
  const dx=tx-P.x, dz=tz-P.z, sn=Math.sin(cam.yaw), cs=Math.cos(cam.yaw);
  const a=Math.atan2(dx*cs-dz*sn,-dx*sn-dz*cs);
  $('cArrow'+(n||'')).style.transform='rotate('+a.toFixed(3)+'rad)'; setText('cDist'+(n||''),label);
}

function addBox(G,x0,y0,z0,x1,y1,z1,material,props,list,cast){
  if(x0>x1)[x0,x1]=[x1,x0]; if(y0>y1)[y0,y1]=[y1,y0]; if(z0>z1)[z0,z1]=[z1,z0];
  const r=v=>Math.round(v*1000)/1000;
  const m=mk(box(r(x1-x0),r(y1-y0),r(z1-z0)),material,cast);
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); G.scene.add(m);
  const b=Object.assign({x0,y0,z0,x1,y1,z1,m},props||{});
  if(list!==null) (list||G.solids).push(b);
  return b;
}
function addClouds(G,n,xr,yr,zr){
  for(let i=0;i<n;i++){ const g=new THREE.Group(); const c=3+Math.floor(Math.random()*3);
    for(let j=0;j<c;j++){ const s=rand(1.4,3); const m=mk(box(+(s*1.6).toFixed(1),+(s*0.7).toFixed(1),+s.toFixed(1)),lam('#ffffff'),false);
      m.receiveShadow=false; m.position.set(j*1.7-c*0.85+rand(-0.4,0.4),rand(-0.3,0.3),rand(-0.6,0.6)); g.add(m); }
    const side=Math.random()<0.5?-1:1; g.position.set(side*rand(xr[0],xr[1]),rand(yr[0],yr[1]),rand(zr[0],zr[1])); G.scene.add(g); }
}

  addBlock(x,y,z,ci,silent){

  query(x0,x1,y0,y1,z0,z1){
    const out=[this.base], L=this.L;
    const a0=Math.max(-L,Math.floor(x0)), a1=Math.min(L-1,Math.floor(x1)), b0=Math.max(0,Math.floor(y0)), b1=Math.min(63,Math.floor(y1)), c0=Math.max(-L,Math.floor(z0)), c1=Math.min(L-1,Math.floor(z1));

  onTap(sx,sy,btn){

  onKey(code){

  /* ---- monde ---- */
  gen(seed){

        if(id===3&&rng()<0.025){ const r=rng(); id=y<6&&r<0.2?16:y<10&&r<0.35?15:r<0.55?14:13; }

    for(let i=0;i<260&&trees.length<70;i++){ const x=3+Math.floor(rng()*(MCW-6)), z=3+Math.floor(rng()*(MCD-6)), h=hm[z*MCW+x];

      if(trees.some(([a,b])=>Math.abs(a-x)<4&&Math.abs(b-z)<4)) continue; trees.push([x,z]);
      const th=4+Math.floor(rng()*2);
      for(let y=h+1;y<=h+th;y++) S_(x,y,z,6);

  buildVillage(rng,hAt,cx,cz,name,legacy){

  regionV(rx,rz){

  buildTemple(r,cx,cz,T){

  /* ---- animaux marins ---- */
  seaLiq(x,y,z){

      let x, z;

        const y=rand(col[0]+1.3,9.5); if(this.seaLiq(x,y,z)) return {x,y,z}; continue; }
      if(kind==='crab'){ const X=Math.floor(x), Z=Math.floor(z);

      if(this.seaLiq(x,y,z)&&(!big||(this.seaLiq(x+1,y,z)&&this.seaLiq(x-1,y,z)&&this.seaLiq(x,y,z+1)&&this.seaLiq(x,y,z-1)))) return {x,y,z};

  seaTarget(c){

/* =========================================================
   10. Jeu à distance avec des copains (Monde de Blocs)
   Connexion directe entre téléphones (WebRTC via PeerJS).
   L'hôte garde le monde ; les invités reçoivent la graine
   et les blocs modifiés, puis chaque bloc posé ou cassé
   est envoyé aux autres.
   ========================================================= */
const NET_VER=1, NET_PREFIX='blocsmahe-v1-', NET_MAX=6, NET_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const NET_LIBS=['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
const NET_CHAT=['👋 Salut !','👍 D\'accord !','🏃 Viens ici !','👀 Regarde !','⛏️ On construit ?','🧟 Attention, monstres !','😂 Trop drôle !','❤️ Merci !'];
const NET={role:null,peer:null,host:null,code:'',conns:new Map(),players:new Map(),myId:'',world:null,wbuf:null,spawn:null,applying:false,out:[],sT:0,eT:0,dT:0,nid:0,busy:false,msg:'',err:'',tok:0,jt:0,starting:false};
function netCode(){ let s=''; for(let i=0;i<5;i++) s+=NET_ABC[Math.floor(Math.random()*NET_ABC.length)]; return s; }
function netLoadLib(){
  if(window.Peer) return Promise.resolve();
  return new Promise((res,rej)=>{ let i=0; const next=()=>{ if(window.Peer) return res(); if(i>=NET_LIBS.length) return rej({type:'lib'});
    const s=document.createElement('script'); s.src=NET_LIBS[i++]; s.async=true; let done=false;
    const t=setTimeout(()=>{ if(done) return; done=true; s.remove(); next(); },15000);
    s.onload=()=>{ if(done) return; done=true; clearTimeout(t); next(); };
    s.onerror=()=>{ if(done) return; done=true; clearTimeout(t); s.remove(); next(); };
    document.head.appendChild(s); }; next(); });
}
function netOpenPeer(id){
  return new Promise((res,rej)=>{
    let done=false, p;
    try{ p=id?new Peer(id,{debug:0}):new Peer({debug:0}); }catch(e){ rej({type:'browser-incompatible'}); return; }
    const t=setTimeout(()=>{ if(done) return; done=true; try{ p.destroy(); }catch(e){} rej({type:'timeout'}); },15000);
    p.on('open',()=>{ if(done) return; done=true; clearTimeout(t); res(p); });
    p.on('error',e=>{ if(!done){ done=true; clearTimeout(t); try{ p.destroy(); }catch(_){} rej(e||{}); } else if(NET.peer===p) netPeerError(e||{}); });
    p.on('disconnected',()=>{ setTimeout(()=>{ try{ if(NET.peer===p&&!p.destroyed&&p.disconnected) p.reconnect(); }catch(e){} },1500); });
  });
}
function netErrText(e){ const t=e&&e.type;
  if(t==='peer-unavailable') return 'Aucune partie avec ce code. Vérifie les lettres, et que ton copain est bien dans sa partie avec l\'écran allumé.';
  if(t==='lib') return 'Impossible de charger le jeu en ligne. Vérifie ta connexion Internet.';
  if(t==='browser-incompatible') return 'Ce navigateur ne permet pas le jeu en ligne. Ouvre Blocs Mahé dans Chrome ou Safari.';
  if(t==='connect') return 'La connexion avec ton copain n\'a pas marché. Essayez en Wi-Fi tous les deux, puis réessayez.';
  if(t==='full') return 'La partie est pleine ('+NET_MAX+' joueurs maximum).';
  if(t==='old') return 'Vous n\'avez pas la même version du jeu : fermez et rouvrez Blocs Mahé tous les deux.';
  return 'Impossible de joindre le serveur de connexion. Vérifie ta connexion Internet et réessaie.';

function netCleanName(n){ return (typeof n==='string'?n:'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,14)||'Copain'; }
function netCleanAv(a){ const d=DEF.avatar, o={}; a=a&&typeof a==='object'?a:{};

function netLeave(quiet){

function netSend(m){ if(NET.role==='host'){ m.id='h'; netBroadcast(m,null); } else if(NET.role==='guest'&&NET.host){ try{ NET.host.send(m); }catch(e){} } }
/* ---------- créer une partie ---------- */
async function netHost(){
  if(NET.busy||NET.role) return; const tok=++NET.tok; NET.busy=true; NET.err=''; netStatus('⏳ Création de la partie…');
  try{
    await netLoadLib(); if(tok!==NET.tok) return;
    let p=null, code='';
    for(let i=0;i<5&&!p;i++){ code=netCode(); try{ p=await netOpenPeer(NET_PREFIX+code); }catch(e){ if(!e||e.type!=='unavailable-id') throw e; } if(tok!==NET.tok){ if(p) p.destroy(); return; } }
    if(!p) throw {type:'server'};
    Object.assign(NET,{peer:p,code,role:'host',myId:'h',nid:0,busy:false,msg:''});
    p.on('connection',c=>netAccept(c));
    if(!(mode==='game'&&G&&G.id==='mc')){ netClosePanel(); startGame('mc'); }
    $('hud').classList.add('net'); netBadge(); netRender();
    banner('👥 Partie ouverte ! Code : '+code); netFeed('🟢 Donne le code '+code+' à tes copains');
  }catch(e){ if(tok===NET.tok) netFail(e); }
}
function netAccept(c){
  let id=null;
  c.on('data',d=>{ try{
    if(!d||typeof d!=='object'||NET.role!=='host') return;
    if(!id){
      if(d.t!=='hello') return;
      if(d.v!==NET_VER){ c.send({t:'old'}); setTimeout(()=>c.close(),600); return; }
      if(NET.conns.size>=NET_MAX-1||!(G&&G.id==='mc'&&G.changes)){ c.send({t:'full'}); setTimeout(()=>c.close(),600); return; }
      id='p'+(++NET.nid); const pl=netAddPlayer(id,d.name,d.av);
      netSendWorld(c,id);
      netBroadcast({t:'join',id,name:pl.name,av:pl.av},null);
      NET.conns.set(id,c); netFeed('👋 '+pl.name+' a rejoint la partie'); sfx('cp'); netRender(); return;
    }
    netHandle(id,d);
  }catch(e){ console.warn(e); } });
  c.on('close',()=>{ if(id&&NET.conns.get(id)===c){ NET.conns.delete(id); const pl=NET.players.get(id); netRemovePlayer(id); netBroadcast({t:'bye',id},null); if(pl) netFeed('🚪 '+pl.name+' est parti'); netRender(); } });
  c.on('error',()=>{});
}
function netSendWorld(c,id){
  const g=G, ch2=[]; g.changes.forEach(q=>q.m.forEach((v,i)=>ch2.push(q.cx*16+(i&15),i>>8,q.cz*16+((i>>4)&15),v)));

  c.send({t:'welcome',id,world:{seed:g.seed,lt:Array.from(g.looted||[]).slice(0,5000),time:+(g.dayT||0).toFixed(4)},pos,players,n:ch2.length});
  for(let i=0;i<ch2.length;i+=4000) c.send({t:'ch',d:ch2.slice(i,i+4000)});
  c.send({t:'ready'});

/* ---------- rejoindre ---------- */
async function netJoin(raw){
  if(NET.busy||NET.role) return;
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==5){ NET.err='Le code a 5 caractères (lettres et chiffres).'; netRender(); return; }
  const tok=++NET.tok; Object.assign(NET,{busy:true,err:'',code,role:'joining'}); netStatus('⏳ Connexion à la partie '+code+'…');
  try{
    await netLoadLib(); if(tok!==NET.tok) return;
    const p=await netOpenPeer(null); if(tok!==NET.tok){ try{ p.destroy(); }catch(e){} return; }
    NET.peer=p;
    const c=p.connect(NET_PREFIX+code,{reliable:true,serialization:'json'}); NET.host=c;
    NET.jt=setTimeout(()=>{ if(NET.role==='joining'&&tok===NET.tok) netFail({type:'connect'}); },25000);
    c.on('open',()=>{ if(NET.host===c){ netStatus('⏳ Chargement du monde de ton copain…'); c.send({t:'hello',v:NET_VER,name:S.name,av:S.avatar}); } });
    c.on('data',d=>{ if(NET.host===c){ try{ netGuestMsg(d); }catch(e){ console.warn(e); } } });
    c.on('close',()=>{ if(NET.host!==c) return; if(NET.role==='joining') netFail({type:'connect'}); else netLost('📴 La partie en ligne est terminée'); });
    c.on('error',()=>{});
  }catch(e){ if(tok===NET.tok) netFail(e); }
}
function netGuestMsg(d){
  if(!d||typeof d!=='object') return; const t=d.t;
  if(t==='welcome'){ const w=d.world||{}; if(!Number.isInteger(w.seed)) return netFail({type:'old'});
    NET.myId=String(d.id);
    NET.wbuf={seed:w.seed,lt:Array.isArray(w.lt)?w.lt.filter(k=>typeof k==='string'):[],time:typeof w.time==='number'&&isFinite(w.time)?w.time:0.3,ch2:[]};
    NET.spawn=Array.isArray(d.pos)&&d.pos.length===3&&d.pos.every(Number.isFinite)?[d.pos[0]+1.2,d.pos[1]+0.3,d.pos[2]+0.6]:null;
    if(Array.isArray(d.players)) for(const p of d.players) if(p&&typeof p.id==='string'&&p.id!==NET.myId) netAddPlayer(p.id,p.name,p.av);
    return; }
  if(t==='ch'){ if(NET.wbuf&&Array.isArray(d.d)) for(const v of d.d) NET.wbuf.ch2.push(v); return; }
  if(t==='ready'){ if(!NET.wbuf) return; clearTimeout(NET.jt);
    NET.world=NET.wbuf; NET.wbuf=null; NET.role='guest'; NET.busy=false; NET.msg=''; netClosePanel();
    NET.starting=true; try{ startGame('mc'); } finally{ NET.starting=false; NET.world=null; }
    banner('👥 Tu as rejoint la partie '+NET.code+' !'); netFeed('🟢 Tu joues dans le monde de ton copain'); return; }
  if(t==='full'||t==='old') return netFail({type:t});
  if(t==='end') return netLost('📴 Ton copain a fermé la partie');
  if(t==='join'&&typeof d.id==='string'){ if(d.id===NET.myId) return; const p=netAddPlayer(d.id,d.name,d.av); netFeed('👋 '+p.name+' a rejoint la partie'); sfx('cp'); netRender(); return; }
  if(t==='bye'&&typeof d.id==='string'){ const p=NET.players.get(d.id); netRemovePlayer(d.id); if(p) netFeed('🚪 '+p.name+' est parti'); netRender(); return; }
  if(t==='d'){ if(typeof d.v==='number'&&isFinite(d.v)&&G&&G.id==='mc') G.dayT=((d.v%1)+1)%1; return; }
  if(NET.role!=='guest') return;
  netHandle(typeof d.id==='string'?d.id:null,d);

/* ---------- messages de jeu ---------- */
function netHandle(from,d){
  const t=d.t, host=NET.role==='host';
  if(t==='s'){ if(Array.isArray(d.s)&&d.s.length>=6&&d.s.length<=12&&d.s.slice(0,6).every(Number.isFinite)){ netState(from,d.s); if(host) netBroadcast({t:'s',id:from,s:d.s},from); } }

  else if(t==='c'){ if(Number.isInteger(d.m)&&d.m>=0&&d.m<NET_CHAT.length){ netChat(from,d.m); if(host) netBroadcast({t:'c',id:from,m:d.m},from); } }
}
function netState(id,s){ const p=NET.players.get(id); if(p) p.s=s; }

}

const netR2=v=>Math.round(v*100)/100;
function netMyState(g){
  const s=[netR2(P.x),netR2(P.y),netR2(P.z),netR2(P.yaw),netR2(Math.min(30,Math.hypot(P.vx,P.vz))),(P.fly?1:0)|(P.onGround?2:0)|(PA&&PA.sit?4:0)|(PA&&PA.swing>0?8:0)];

function netDrawPlayer(g,p,dt){

function netGuestSave(own){ const w=NET.world; return {seed:w.seed,ch2:w.ch2,lt:w.lt,time:w.time,inv:own&&own.inv,hot:own&&own.hot,pos:NET.spawn}; }
/* ---------- branchement dans le Monde de Blocs ---------- */
{ const M=GAMES.mc;

      if(k==='snow'){ y-=dt*(0.9+(f%1)*0.8); x+=Math.sin(t*0.8+f)*dt*0.7; }
      else if(k==='embers'){ y+=dt*(1.2+(f%1)*1.6); x+=Math.sin(t*2+f)*dt*0.6; }
      else if(k==='fireflies'){ x+=Math.sin(t*0.7+f)*dt*0.9; y+=Math.sin(t*1.3+f*2)*dt*0.5; z+=Math.cos(t*0.6+f)*dt*0.9; }
      else if(k==='petals'){ y-=dt*(0.7+(f%1)*0.5); x+=Math.sin(t*1.4+f)*dt*1.1; z+=dt*0.35; }
      else if(k==='dust'){ x+=Math.sin(t*0.3+f)*dt*0.3; y+=Math.sin(t*0.5+f)*dt*0.2; }
      else if(k==='rise'){ y+=dt*(0.6+(f%1)*0.8); }

  const top=new THREE.Group(); top.position.set(x,y,0); g.add(top);
  for(let i=0;i<7;i++){ const a=i/7*TAU+rng()*0.3, f=new THREE.Group(); f.rotation.y=a; const l=mk(box(0.42,0.08,2.1),i%2?lf:lf2); l.position.set(0,0,1.0); l.rotation.x=0.42; f.add(l); const t=mk(box(0.3,0.06,0.9),i%2?lf2:lf); t.position.set(0,-0.55,2.15); t.rotation.x=0.9; f.add(t); top.add(f); }

function el(tag,cls,html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function renderPlay(){
  const p=$('pane-play'); p.innerHTML='';
  const hi=el('div','hi'); hi.appendChild(document.createTextNode('Salut ')); const nm=el('span'); nm.textContent=S.name; hi.appendChild(nm); hi.appendChild(document.createTextNode(' ! À quoi on joue ?')); p.appendChild(hi); netCard(p);
  const wrap=el('div','cards'); p.appendChild(wrap);
  for(const g of GAME_LIST){
    const b=el('button','card',`<span class="play">▶ Jouer</span><span class="ic">${g.ic}</span><h3>${g.t}</h3><p>${g.d}</p><span class="best">${g.best()}</span>`);
    b.style.background=g.bg; b.addEventListener('click',()=>{ sfx('click'); startGame(g.id); }); wrap.appendChild(b);
  }
}
function rerender(id,fn){ const p=$(id), st=p.scrollTop; fn(); p.scrollTop=st; }
function renderAvatar(){
  const p=$('pane-avatar'); p.innerHTML='';
  const sec=t=>{ const s=el('div','sec'); const h=el('h4'); h.textContent=t; s.appendChild(h); p.appendChild(s); return s; };
  const ns=sec('Ton pseudo'); const inp=el('input','name-in'); inp.maxLength=14; inp.value=S.name; inp.placeholder='Ton pseudo'; inp.autocomplete='off';
  inp.addEventListener('input',()=>{ S.name=inp.value.trim().slice(0,14)||'Joueur'; saveSoon(); });
  inp.addEventListener('change',()=>{ save(); renderPlay(); });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') inp.blur(); });
  ns.appendChild(inp);
  const swRow=(title,list,key)=>{ const w=el('div','sw'); sec(title).appendChild(w);
    for(const c of list){ const b=el('button','swatch'+(S.avatar[key]===c?' on':'')); b.style.background=c; b.setAttribute('aria-label',title+' '+c);
      b.addEventListener('click',()=>{ S.avatar[key]=c; sfx('click'); refreshLobbyAvatar(); saveSoon(); rerender('pane-avatar',renderAvatar); }); w.appendChild(b); } };
  const optRow=(title,list,key)=>{ const w=el('div','sw'); sec(title).appendChild(w);
    for(const it of list){ if(!S.owned[key].includes(it.id)) continue;
      const b=el('button','opt'+(S.avatar[key]===it.id?' on':''),(key==='face'?`<img alt="" src="${faceURL(it.id,S.avatar.skin)}">`:`<span class="em">${it.ic}</span>`)+`<span>${it.name}</span>`);
      b.addEventListener('click',()=>{ S.avatar[key]=it.id; sfx('click'); refreshLobbyAvatar(); saveSoon(); rerender('pane-avatar',renderAvatar); }); w.appendChild(b); }
    const more=el('button','opt','<span class="em">🛒</span><span>Plus…</span>'); more.addEventListener('click',()=>switchTab('shop')); w.appendChild(more); };
  swRow('Peau',SKINS,'skin'); optRow('Visage',FACES,'face'); optRow('Chapeau',HATS,'hat');
  swRow('T-shirt',CLOTHES,'shirt'); swRow('Pantalon',CLOTHES,'pants'); swRow('Chaussures',SHOES,'shoes');
}
function renderShop(){
  const p=$('pane-shop'); p.innerHTML='';
  const note=el('p','shop-note'); note.textContent='Gagne des pièces en jouant, puis achète des accessoires pour ton avatar !'; p.appendChild(note);
  const grid=(title,list,key)=>{ const h=el('h4','shop-h'); h.textContent=title; p.appendChild(h); const g=el('div','shop'); p.appendChild(g);
    for(const it of list){ if(it.id==='none') continue;
      const owned=S.owned[key].includes(it.id), on=S.avatar[key]===it.id;
      const vis=key==='face'?`<img alt="" src="${faceURL(it.id,S.avatar.skin)}">`:`<span class="em">${it.ic}</span>`;
      const pr=on?'<span class="pr owned">Équipé</span>':owned?'<span class="pr owned">Mettre</span>':`<span class="pr"><span class="coin"></span>${it.price}</span>`;
      const b=el('button','item'+(on?' on':''),vis+`<span class="nm">${it.name}</span>`+pr);
      b.addEventListener('click',()=>{
        if(owned){ S.avatar[key]=it.id; sfx('click'); }
        else if(S.coins>=it.price){ S.coins-=it.price; S.owned[key].push(it.id); S.avatar[key]=it.id; sfx('buy'); toast('Acheté : '+it.name+' !'); celebrateLobby(); updateCoinsUI(); }
        else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); sfx('nope'); toast('Il te manque '+(it.price-S.coins)+' pièces : joue pour en gagner !'); return; }
        refreshLobbyAvatar(); save(); rerender('pane-shop',renderShop);
      });
      g.appendChild(b); } };
  grid('Chapeaux',HATS,'hat'); grid('Visages',FACES,'face');
}
function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+t));
  if(t==='shop') renderShop(); else if(t==='avatar') renderAvatar(); else renderPlay();
  const p=$('pane-'+t); if(p) p.scrollTop=0;
}

let camPtr=null;
canvas.addEventListener('pointerdown',e=>{
  unlockAudio(); if(camPtr) return;
  camPtr={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),moved:0,btn:e.button};
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  if(mode==='menu'){ lobby.drag=true; lobby.spinV=0; }
  if(mode==='game'&&G&&G.onPress&&e.pointerType==='mouse'&&e.button===0) G.onPress(true);
  if(mode==='game'&&G&&G.onDown) G.onDown(e.clientX,e.clientY,e.button,e.pointerType);
});
canvas.addEventListener('pointermove',e=>{
  if(!camPtr||e.pointerId!==camPtr.id) return;
  const dx=e.clientX-camPtr.x, dy=e.clientY-camPtr.y; camPtr.x=e.clientX; camPtr.y=e.clientY; camPtr.moved+=Math.abs(dx)+Math.abs(dy);
  if(mode==='game'){ cam.yaw-=dx*0.0075; cam.pitch=clamp(cam.pitch+dy*0.006,G&&G.pmin!==undefined?G.pmin:-0.25,G&&G.pmax!==undefined?G.pmax:1.35); if(G&&G.onMoveP) G.onMoveP(e.clientX,e.clientY,camPtr.moved); }
  else { lobby.yaw+=dx*0.012; lobby.spinV=clamp(dx*0.5,-6,6); }
});
function endPtr(e){
  if(!camPtr||e.pointerId!==camPtr.id) return;
  if(mode==='game'&&G&&G.onPress) G.onPress(false);
  const tap=camPtr.moved<12&&performance.now()-camPtr.t<400, btn=camPtr.btn; camPtr=null; lobby.drag=false;
  if(mode==='game'&&G&&G.onUp) G.onUp(e.clientX,e.clientY,tap,btn,e.pointerType);
  if(!tap) return;
  if(mode==='game'&&G&&!G.over&&G.onTap) G.onTap(e.clientX,e.clientY,btn);
  else if(mode==='menu'&&lobby.A){ lobby.A.waveT=1.4; sfx('click'); }
}
canvas.addEventListener('pointerup',endPtr);
canvas.addEventListener('pointercancel',e=>{ if(camPtr&&e.pointerId===camPtr.id){ camPtr=null; lobby.drag=false; if(mode==='game'&&G&&G.onPress) G.onPress(false); if(mode==='game'&&G&&G.onUp) G.onUp(0,0,false,0,''); } });
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{ if(mode==='game') cam.dist=clamp(cam.dist+e.deltaY*0.008,3,16); },{passive:true});

const joyEl=$('joy'), knob=$('joyKnob');
function joyMove(e){ let dx=e.clientX-joy.cx, dy=e.clientY-joy.cy; const R=50, d=Math.hypot(dx,dy); if(d>R){ dx*=R/d; dy*=R/d; }
  knob.style.transform=`translate(calc(-50% + ${dx.toFixed(1)}px),calc(-50% + ${dy.toFixed(1)}px))`;
  if(Math.hypot(dx,dy)/R<0.12){ joy.x=0; joy.y=0; } else { joy.x=dx/R; joy.y=-dy/R; } }
function resetJoy(){ joy.id=null; joy.x=0; joy.y=0; knob.style.transform='translate(-50%,-50%)'; }
joyEl.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); unlockAudio(); joy.id=e.pointerId;
  try{ joyEl.setPointerCapture(e.pointerId); }catch(_){} const r=joyEl.getBoundingClientRect(); joy.cx=r.left+r.width/2; joy.cy=r.top+r.height/2; joyMove(e); });
joyEl.addEventListener('pointermove',e=>{ if(e.pointerId===joy.id) joyMove(e); });
['pointerup','pointercancel','lostpointercapture'].forEach(t=>joyEl.addEventListener(t,e=>{ if(e.pointerId===joy.id) resetJoy(); }));
function holdBtn(b,on,off){
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); unlockAudio(); b.classList.add('down'); try{ b.setPointerCapture(e.pointerId); }catch(_){} on(); });
  const up=()=>{ b.classList.remove('down'); if(off) off(); };
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,up));
}

$('mcMode').addEventListener('click',()=>{ const g=mcG(); if(g){ sfx('click'); g.panel==='settings'?g.closePanel():g.openPanel('settings'); } });
$('hudTop').addEventListener('click',()=>{ const g=mcG(); if(g){ sfx('click'); g.openPanel('settings'); } });

[['cnU','u'],['cnD','d'],['cnL','l'],['cnR','r'],['cnA','a'],['cnB','b']].forEach(([id,k])=>{ const b=$(id);
  const dn=e=>{ if(e&&e.preventDefault) e.preventDefault(); const g=mcG(); if(!g||g.panel!=='console') return; g.cpad[k]=true; b.classList.add('on'); unlockAudio(); g.conPress(k); };
  const up=()=>{ const g=mcG(); if(g&&g.cpad) g.cpad[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',dn); b.addEventListener('pointerup',up); b.addEventListener('pointerleave',up); b.addEventListener('pointercancel',up); });
$('cnMenu').addEventListener('click',()=>{ const g=mcG(); if(g) g.conPress('menu'); });

(function(){ const pal=$('palette');
  PAL.forEach((p,i)=>{ const b=el('button'); b.style.background=p.glass?'linear-gradient(135deg,#f0fbff,#9fd8ff)':p.c;
    if(p.neon) b.style.boxShadow='0 0 10px '+(p.c==='#fff3a0'?'#ffd84d':p.c)+', inset 0 -3px 0 rgba(0,0,0,.15)';

addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT') return;
  if(mode!=='game') return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  keys.add(e.code); if(e.repeat) return;
  unlockAudio();
  const con=G&&G.panel==='console';
  if(e.code==='Space'&&!con) P.jumpBuf=0.15;
  if(G&&!G.over){ if(!con&&(e.code==='KeyE'||e.code==='Enter'||(e.code==='KeyF'&&G.id==='arena'))&&G.onAction) G.onAction(); if(G.onKey) G.onKey(e.code); }
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>{ keys.clear(); resetJoy(); jumpHeld=false; downHeld=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ save(); keys.clear(); resetJoy(); jumpHeld=false; downHeld=false; } });
addEventListener('resize',resize);

/* =========================================================
   Boucle principale
   ========================================================= */
let last=performance.now(), hudT=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000; last=now; if(!(dt>0)) return; if(dt>0.1) dt=0.1;
  bgmTick();
  if(mode==='menu'){ updateLobby(dt); renderer.render(lobby.scene,camera); return; }
  if(!G) return;
  readInput();
  if(!G.over){
    G.time+=dt;
    if(G.preStep) G.preStep(dt);
    if(P.onGround&&P.ground&&P.ground.dx!==undefined){ P.x+=P.ground.dx; P.y+=P.ground.dy||0; P.z+=P.ground.dz||0; }
    if(inp.jumpHeld&&!P.fly) P.jumpBuf=Math.max(P.jumpBuf,0.05);
    if(!G.frozen){ const n=Math.ceil(dt/0.008), h=dt/n; for(let i=0;i<n;i++) stepPlayer(h); }
    if(G.update) G.update(dt);
  } else { P.vx*=0.9; P.vz*=0.9; if(G.idle) G.idle(dt); }
  if(!G) return;
  PA.root.position.set(P.x,P.y,P.z); PA.root.rotation.y=P.yaw;
  animAvatar(PA,dt,Math.hypot(P.vx,P.vz),P.onGround||P.fly);
  if(P.inv>0){ P.inv-=dt; PA.root.visible=!G.fp&&Math.floor(P.inv*14)%2===0; } else PA.root.visible=!G.fp;
  updateParts(dt);
  updateCam(dt);
  envFrame(dt);
  const sun=G.scene.userData.sun, so=G.sunOff; if(sun){ sun.position.set(P.x+(so?so[0]:14),P.y+(so?so[1]:30),P.z+(so?so[2]:10)); sun.target.position.set(P.x,P.y,P.z); }
  hudT-=dt; if(hudT<=0){ hudT=0.15; G.hud(); }
  renderer.render(G.scene,camera);
}

refreshLobbyAvatar(); renderHome(); resize(); bgmPlay('menu');
requestAnimationFrame(t=>{ last=t; loop(t); });
})();
